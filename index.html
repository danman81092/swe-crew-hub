<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071326"><link rel="manifest" href="/manifest.webmanifest"><title>SWE Crew</title><style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#edf6ff;background:#071326}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{border:0;border-radius:13px;background:#137cf5;color:white;font-weight:750;padding:13px 17px;cursor:pointer}button.alt{background:#183353}button.danger{background:#8c3041}button:disabled{opacity:.4}input,select,textarea{background:#0d2139;color:#fff;border:1px solid #35516e;border-radius:11px;padding:12px;width:100%;min-height:44px}textarea{min-height:88px;resize:vertical}label{display:block;color:#a9c6e8;font-size:12px;font-weight:750;margin:10px 0 5px}.app{max-width:1040px;margin:auto;padding:16px 16px 94px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0 16px}.brand{display:flex;align-items:center;gap:10px}.brand img{height:58px;width:58px;object-fit:cover;border-radius:14px}.eyebrow{color:#59b5ff;letter-spacing:.1em;font-size:11px;font-weight:800}h1{font-size:25px;margin:3px 0}h2{font-size:19px;margin:0 0 12px}h3{margin:10px 0}p{color:#a9c6e8}.card{background:linear-gradient(145deg,#142b49,#0d1f36);border:1px solid #28466b;border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 8px 24px #0002}.hero{background:linear-gradient(120deg,#075fd7,#14a4ff);border:0}.hero p{color:#e4f4ff}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.tile{padding:20px;text-align:left;min-height:125px;background:#183a63;border-radius:18px;display:flex;flex-direction:column;justify-content:space-between}.tile span{font-size:26px}.tile small{color:#b9d9ff}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.stack{display:grid;gap:10px}.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.pill{font-size:11px;background:#164f85;color:#bde1ff;padding:6px 10px;border-radius:30px;font-weight:700}.nav{position:fixed;bottom:0;left:0;right:0;background:#08182d;border-top:1px solid #2b496c;display:flex;justify-content:center;padding:8px 6px max(8px,env(safe-area-inset-bottom));z-index:5}.nav button{background:transparent;color:#9db6d5;flex:1;max-width:220px;padding:8px 3px;font-size:11px}.nav button.active{color:#4eaaff}.nav b{display:block;font-size:21px}.day{padding:14px;background:#0a1d34;border:1px solid #244363;border-radius:15px;margin:10px 0}.muted{color:#9fb7d4;font-size:12px}.line{border-bottom:1px solid #2b486a;padding:12px 0}.hidden{display:none!important}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.actions button{flex:1}.signature{width:100%;height:130px;touch-action:none;background:#f6fbff;border-radius:12px;border:2px dashed #58a8ff}.number{font-size:27px;font-weight:850;color:#65bdff}.notice{padding:12px;border-radius:12px;background:#123d60;color:#c9e9ff;margin:10px 0}.bad{background:#5e2637}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:10px;text-align:left;border-bottom:1px solid #2b486a}a{color:#6cbcff}@media(min-width:720px){.grid{grid-template-columns:repeat(4,1fr)}.fields{grid-template-columns:repeat(4,1fr)}.app{padding:24px 24px 100px}}
</style></head><body><main class="app"><header class="top"><div class="brand"><img src="/logo.jpg" alt="South West Earthworks logo"><div><div class="eyebrow">SOUTH WEST EARTHWORKS</div><h1>CREW HUB</h1></div></div><button class="alt" id="logout" style="display:none" onclick="logout()">Log out</button></header><div id="screen"></div></main><nav class="nav hidden" id="nav"><button onclick="go('home')" id="n-home"> <b>⌂</b>Home</button><button onclick="go('timesheet')" id="n-timesheet"><b>◷</b>Timesheet</button><button onclick="go('docket')" id="n-docket"><b>▤</b>Plant & Materials</button><button onclick="go('history')" id="n-history"><b>◴</b>History</button><button onclick="go('office')" id="n-office" class="hidden"><b>▦</b>Office</button></nav><script>
let me=null,records=[],catalog=[],users=[],page='home',signature='',editing=null;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=async(url,opts={})=>{const r=await fetch('/api'+url,{headers:{'Content-Type':'application/json'},...opts});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d};
const post=(url,data)=>api(url,{method:'POST',body:JSON.stringify(data)});
const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Australia/Melbourne'});
const monday=()=>{let d=new Date(),dow=(d.getDay()+6)%7;d.setDate(d.getDate()-dow);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const hours=d=>{if(d.kind!=='work'||!d.start||!d.finish)return 0;let a=d.start.split(':').map(Number),b=d.finish.split(':').map(Number);return Math.max(0,((b[0]*60+b[1])-(a[0]*60+a[1]))/60-(+d.break||0))};
const select=(kind,extra='')=>`<select ${extra}>${catalog.filter(c=>c.kind===kind).map(c=>`<option value="${esc(c.name)}">${esc(c.name)}</option>`).join('')}</select>`;
async function refresh(){records=await api('/records');catalog=await api('/catalog');if(me.role==='manager')users=await api('/users')}
function notify(s,error=false){let n=document.createElement('div');n.className='notice'+(error?' bad':'');n.textContent=s;$('#screen').prepend(n);setTimeout(()=>n.remove(),4500)}
function go(p){page=p;document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));$('#n-'+p)?.classList.add('active');if(p==='home')home();if(p==='timesheet')timesheet();if(p==='docket')docket();if(p==='history')history();if(p==='office')office()}
function login(){ $('#screen').innerHTML=`<section class="card" style="max-width:430px;margin:50px auto"><h2>Welcome to SWE Crew</h2><p>Enter your employee name and 4-digit PIN.</p><form id="loginform"><label>Employee name</label><input id="username" required autocomplete="username" placeholder="e.g. Brandon"><label>4-digit PIN</label><input id="pin" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" required autocomplete="current-password"><div class="actions"><button>Sign in →</button></div></form></section>`;$('#loginform').onsubmit=async e=>{e.preventDefault();try{me=await post('/login',{name:$('#username').value,pin:$('#pin').value});await start()}catch(err){notify(err.message,true)}}}
async function start(){await refresh();$('#logout').style.display='block';$('#nav').classList.remove('hidden');$('#n-office').classList.toggle('hidden',me.role!=='manager');go('home')}
async function logout(){await post('/logout',{});me=null;$('#nav').classList.add('hidden');$('#logout').style.display='none';login()}
function home(){let mine=records.filter(r=>r.user_id===me.id),submitted=mine.filter(r=>r.status==='submitted'||r.status==='approved').length;$('#screen').innerHTML=`<section class="card hero"><div class="eyebrow" style="color:#e4f4ff">EMPLOYEE PORTAL</div><h1>G'day, ${esc(me.name)} 👋</h1><p>Record your week, plant hours and materials in one place.</p></section><section class="grid"><button class="tile" onclick="go('timesheet')"><span>◷</span>Weekly timesheet<small>Hours & signature</small></button><button class="tile" onclick="go('docket')"><span>▤</span>Plant & materials<small>Job dockets</small></button><button class="tile" onclick="go('history')"><span>◴</span>My history<small>${submitted} submitted</small></button>${me.role==='manager'?'<button class="tile" onclick="go(\'office\')"><span>▦</span>Office dashboard<small>Review submissions</small></button>':''}</section><section class="card"><h2>My recent submissions</h2>${mine.slice(0,4).map(r=>`<div class="line row"><div><b>${r.type==='timesheet'?'Weekly timesheet':'Plant & materials'}</b><div class="muted">${esc(r.week||r.date)}</div></div><span class="pill">${esc(r.status)}</span></div>`).join('')||'<p>No records yet. Start your first timesheet.</p>'}</section>`}
function timesheet(){editing=null;let mon=monday();$('#screen').innerHTML=`<section class="card"><h2>Weekly timesheet</h2><label>Week commencing (Monday)</label><input id="week" type="date" value="${mon}" onchange="buildDays()"><div id="days"></div><div class="row"><b>Weekly total</b><span class="number" id="total">0.00 hrs</span></div><h3>Employee signature</h3><p class="muted">Sign with your finger. Signature is required before submitting.</p><canvas id="sig" class="signature"></canvas><div class="actions"><button class="alt" onclick="clearSig()">Clear signature</button><button onclick="saveTimesheet(false)">Save draft</button><button onclick="saveTimesheet(true)">Sign & submit</button></div></section>`;buildDays();setupSig()}
function buildDays(){const mon=$('#week').value;const base=new Date(mon+'T12:00:00');$('#days').innerHTML=Array.from({length:7},(_,i)=>{let d=new Date(base);d.setDate(d.getDate()+i);let day=d.toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'short'});return `<div class="day" data-day="${i}"><div class="row"><b>${day}</b><b class="muted" id="h${i}">0.00 hrs</b></div><label>Day type</label><select class="kind" onchange="calc()">${['work','holiday','public holiday','sick leave','day off'].map(x=>`<option value="${x}" ${i>4&&x==='day off'?'selected':''}>${x}</option>`).join('')}</select><div class="fields"><div><label>Start</label><input type="time" class="start" onchange="calc()"></div><div><label>Finish</label><input type="time" class="finish" onchange="calc()"></div><div><label>Break (hours)</label><input type="number" min="0" step="0.25" class="break" value="0" oninput="calc()"></div></div><label>Description of works (press Enter for new job)</label><textarea class="desc" placeholder="Job 1 – work completed\nJob 2 – work completed"></textarea></div>`}).join('');calc()}
function daysData(){return [...document.querySelectorAll('[data-day]')].map(el=>({kind:el.querySelector('.kind').value,start:el.querySelector('.start').value,finish:el.querySelector('.finish').value,break:+el.querySelector('.break').value||0,description:el.querySelector('.desc').value}))}
function calc(){let ds=daysData();ds.forEach((d,i)=>$('#h'+i).textContent=hours(d).toFixed(2)+' hrs');$('#total').textContent=ds.reduce((s,d)=>s+hours(d),0).toFixed(2)+' hrs'}
function setupSig(){let c=$('#sig'),ctx=c.getContext('2d');c.width=c.clientWidth*devicePixelRatio;c.height=130*devicePixelRatio;ctx.scale(devicePixelRatio,devicePixelRatio);ctx.strokeStyle='#0d2b52';ctx.lineWidth=2.6;ctx.lineCap='round';let down=false;const pos=e=>{let r=c.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]};c.onpointerdown=e=>{down=true;c.setPointerCapture(e.pointerId);ctx.beginPath();ctx.moveTo(...pos(e));ctx.lineTo(...pos(e));ctx.stroke();signature='drawn'};c.onpointermove=e=>{if(down){ctx.lineTo(...pos(e));ctx.stroke()}};c.onpointerup=()=>down=false}
function clearSig(){let c=$('#sig');c.getContext('2d').clearRect(0,0,c.width,c.height);signature=''}
async function saveTimesheet(submit){try{let data={days:daysData(),signature:signature?$('#sig').toDataURL('image/png'):''};if(submit&&!signature)throw Error('Please sign your timesheet first');let week=$('#week').value;let r=await post('/records',{type:'timesheet',date:week,week,data});if(submit)await post('/records/'+r.id+'/submit',{});await refresh();go('history');notify(submit?'Timesheet submitted to the office':'Draft saved')}catch(e){notify(e.message,true)}}
let machineRows=0,materialRows=0;
function docket(){machineRows=0;materialRows=0;$('#screen').innerHTML=`<section class="card"><h2>Plant & materials docket</h2><div class="fields"><div><label>Date</label><input type="date" id="ddate" value="${today()}"></div><div><label>Job / site</label>${select('job','id="djob"')}</div></div><h3>Machines used</h3><div id="machines"></div><button class="alt" onclick="addLine('machine')">+ Add machine</button><h3>Materials used</h3><div id="materials"></div><button class="alt" onclick="addLine('material')">+ Add material</button><label>Notes</label><textarea id="dnotes" placeholder="Additional details, delivery docket numbers, etc."></textarea><div class="actions"><button onclick="saveDocket(false)">Save draft</button><button onclick="saveDocket(true)">Submit docket</button></div></section>`;addLine('machine');addLine('material')}
function addLine(kind){const target=kind==='machine'?'machines':'materials',unit=kind==='machine'?'Hours':'Quantity';let el=document.createElement('div');el.className='day entry';el.innerHTML=`<div class="fields"><div><label>${kind==='machine'?'Machine':'Material'}</label>${select(kind,'class="itemname"')}</div><div><label>${unit}</label><input type="number" min="0" step="0.1" class="qty" value="0"></div>${kind==='material'?'<div><label>Unit</label><select class="unit"><option>tonnes</option><option>m³</option><option>loads</option><option>bags</option><option>litres</option></select></div>':''}</div><button class="alt" style="margin-top:8px" onclick="this.closest('.entry').remove()">Remove</button>`;$('#'+target).append(el)}
function entries(id){return [...document.querySelectorAll('#'+id+' .entry')].map(el=>({name:el.querySelector('.itemname').value,qty:+el.querySelector('.qty').value,unit:el.querySelector('.unit')?.value||(id==='machines'?'hours':'tonnes')})).filter(x=>x.qty>0)}
async function saveDocket(submit){try{const date=$('#ddate').value,data={job:$('#djob').value,machines:entries('machines'),materials:entries('materials'),notes:$('#dnotes').value};if(!data.machines.length&&!data.materials.length)throw Error('Enter at least one machine or material quantity');let r=await post('/records',{type:'docket',date,data});if(submit)await post('/records/'+r.id+'/submit',{});await refresh();go('history');notify(submit?'Docket submitted to the office':'Draft saved')}catch(e){notify(e.message,true)}}
function history(){let mine=records.filter(r=>r.user_id===me.id);$('#screen').innerHTML=`<section class="card"><h2>My submissions</h2><p>All your saved timesheets and plant/material dockets.</p>${mine.map(r=>`<div class="line"><div class="row"><div><b>${r.type==='timesheet'?'Weekly timesheet':'Plant & materials'}</b><div class="muted">${esc(r.week||r.date)} · ${esc(r.data.job||'')}</div></div><span class="pill">${esc(r.status)}</span></div><div class="actions"><button class="alt" onclick="viewRecord(${r.id})">View details</button>${['draft','returned'].includes(r.status)?`<button onclick="submitRecord(${r.id})">Submit</button>`:''}</div></div>`).join('')||'<p>No entries yet.</p>'}</section>`}
function viewRecord(id){let r=records.find(x=>x.id===id);let d=r.data;let content=r.type==='timesheet'?`<p>Total: <b>${d.days.reduce((s,x)=>s+hours(x),0).toFixed(2)} hours</b></p>${d.days.map((x,i)=>`<div class="line"><b>${['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'][i]} · ${hours(x).toFixed(2)} hrs</b><p>${esc(x.kind)} · ${esc(x.start)}–${esc(x.finish)} · break ${esc(x.break)}</p><div style="white-space:pre-wrap">${esc(x.description)}</div></div>`).join('')}${d.signature?`<p>Signed:</p><img style="width:100%;max-width:380px;background:white;border-radius:12px" src="${d.signature}">`:''}`:`<p>Job: ${esc(d.job)}</p><h3>Machines</h3>${d.machines.map(x=>`<p>${esc(x.name)}: ${x.qty} hours</p>`).join('')}<h3>Materials</h3>${d.materials.map(x=>`<p>${esc(x.name)}: ${x.qty} ${esc(x.unit)}</p>`).join('')}<p>${esc(d.notes)}</p>`;$('#screen').innerHTML=`<section class="card"><button class="alt" onclick="go('${me.role==='manager'?'office':'history'}')">← Back</button><h2>${esc(r.employee)} · ${esc(r.type)}</h2><span class="pill">${esc(r.status)}</span>${content}<div class="actions"><button class="alt" onclick="audit(${id})">View change history</button></div><div id="audit"></div></section>`}
async function audit(id){let x=await api('/audit/'+id);$('#audit').innerHTML=x.map(a=>`<div class="line muted">${esc(a.at)} · ${esc(a.actor)} · ${esc(a.action)} ${esc(a.details)}</div>`).join('')}
async function submitRecord(id){try{await post('/records/'+id+'/submit',{});await refresh();go('history');notify('Submitted')}catch(e){notify(e.message,true)}}
function office(){if(me.role!=='manager')return go('home');let waiting=records.filter(r=>r.status==='submitted'),allH=records.filter(r=>r.type==='timesheet').reduce((s,r)=>s+r.data.days.reduce((a,d)=>a+hours(d),0),0),plant=records.filter(r=>r.type==='docket').reduce((s,r)=>s+r.data.machines.reduce((a,d)=>a+d.qty,0),0);$('#screen').innerHTML=`<section class="card hero"><h2>Office dashboard</h2><p>Shared live submissions from your crew.</p></section><section class="grid"><div class="card"><div class="muted">Submitted for review</div><div class="number">${waiting.length}</div></div><div class="card"><div class="muted">Labour hours</div><div class="number">${allH.toFixed(1)}</div></div><div class="card"><div class="muted">Plant hours</div><div class="number">${plant.toFixed(1)}</div></div><div class="card"><div class="muted">Employees</div><div class="number">${users.filter(u=>u.active).length}</div></div></section><section class="card"><div class="row"><h2>Submissions</h2><button onclick="location.href='/api/export'">Export CSV ↓</button></div>${records.map(r=>`<div class="line"><div class="row"><div><b>${esc(r.employee)}</b> · ${esc(r.type)}<div class="muted">${esc(r.week||r.date)}</div></div><span class="pill">${esc(r.status)}</span></div><div class="actions"><button class="alt" onclick="viewRecord(${r.id})">View</button>${r.status==='submitted'?`<button onclick="review(${r.id},'approved')">Approve</button><button class="danger" onclick="review(${r.id},'returned')">Return</button>`:''}</div></div>`).join('')||'<p>No submissions yet.</p>'}</section><section class="card"><h2>Add employee</h2><form id="newuser" class="fields"><div><label>Employee name</label><input name="name" required></div><div><label>4-digit PIN</label><input name="pin" inputmode="numeric" pattern="[0-9]{4}" required></div><div><label>Role</label><select name="role"><option value="employee">Employee</option><option value="manager">Manager</option></select></div><div style="align-self:end"><button>Add employee</button></div></form></section><section class="card"><h2>Add job, machine or material</h2><form id="newcat" class="fields"><div><label>Type</label><select name="kind"><option value="job">Job</option><option value="machine">Machine</option><option value="material">Material</option></select></div><div><label>Name</label><input name="name" required></div><div><label>Unit (optional)</label><input name="unit"></div><div style="align-self:end"><button>Add item</button></div></form></section>`;$('#newuser').onsubmit=async e=>{e.preventDefault();try{await post('/users',Object.fromEntries(new FormData(e.target)));await refresh();office();notify('Employee added')}catch(e){notify(e.message,true)}};$('#newcat').onsubmit=async e=>{e.preventDefault();try{await post('/catalog',Object.fromEntries(new FormData(e.target)));await refresh();office();notify('Item added')}catch(e){notify(e.message,true)}}}
async function review(id,status){try{await post('/records/'+id+'/review',{status});await refresh();office();notify('Record '+status)}catch(e){notify(e.message,true)}}
(async()=>{try{me=await api('/me');await start()}catch{login()}})();if('serviceWorker'in navigator)navigator.serviceWorker.register('/service-worker.js').catch(()=>{});
</script></body></html>
