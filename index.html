<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071326"><link rel="manifest" href="/manifest.webmanifest"><title>SWE Crew</title><style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#edf6ff;background:#071326}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{border:0;border-radius:13px;background:#137cf5;color:white;font-weight:750;padding:13px 17px;cursor:pointer}button.alt{background:#183353}button.danger{background:#8c3041}button:disabled{opacity:.4}input,select,textarea{background:#0d2139;color:#fff;border:1px solid #35516e;border-radius:11px;padding:12px;width:100%;min-height:44px}textarea{min-height:88px;resize:vertical}label{display:block;color:#a9c6e8;font-size:12px;font-weight:750;margin:10px 0 5px}.app{max-width:1040px;margin:auto;padding:16px 16px 94px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0 16px}.brand{display:flex;align-items:center;gap:10px}.brand img{height:58px;width:58px;object-fit:cover;border-radius:14px}.eyebrow{color:#59b5ff;letter-spacing:.1em;font-size:11px;font-weight:800}h1{font-size:25px;margin:3px 0}h2{font-size:19px;margin:0 0 12px}h3{margin:10px 0}p{color:#a9c6e8}.card{background:linear-gradient(145deg,#142b49,#0d1f36);border:1px solid #28466b;border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 8px 24px #0002}.hero{background:linear-gradient(120deg,#075fd7,#14a4ff);border:0}.hero p{color:#e4f4ff}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.tile{padding:20px;text-align:left;min-height:125px;background:#183a63;border-radius:18px;display:flex;flex-direction:column;justify-content:space-between}.tile span{font-size:26px}.tile small{color:#b9d9ff}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.stack{display:grid;gap:10px}.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.pill{font-size:11px;background:#164f85;color:#bde1ff;padding:6px 10px;border-radius:30px;font-weight:700}.nav{position:fixed;bottom:0;left:0;right:0;background:#08182d;border-top:1px solid #2b496c;display:flex;justify-content:center;padding:8px 6px max(8px,env(safe-area-inset-bottom));z-index:5}.nav button{background:transparent;color:#9db6d5;flex:1;max-width:220px;padding:8px 3px;font-size:11px}.nav button.active{color:#4eaaff}.nav b{display:block;font-size:21px}.day{padding:14px;background:#0a1d34;border:1px solid #244363;border-radius:15px;margin:10px 0}.muted{color:#9fb7d4;font-size:12px}.line{border-bottom:1px solid #2b486a;padding:12px 0}.hidden{display:none!important}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.actions button{flex:1}.signature{width:100%;height:130px;touch-action:none;background:#f6fbff;border-radius:12px;border:2px dashed #58a8ff}.number{font-size:27px;font-weight:850;color:#65bdff}.notice{padding:12px;border-radius:12px;background:#123d60;color:#c9e9ff;margin:10px 0}.bad{background:#5e2637}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:10px;text-align:left;border-bottom:1px solid #2b486a}a{color:#6cbcff}@media(min-width:720px){.grid{grid-template-columns:repeat(4,1fr)}.fields{grid-template-columns:repeat(4,1fr)}.app{padding:24px 24px 100px}}
.weekgrid{min-width:520px}.weekgrid input,.weekgrid select{min-width:105px;padding:8px}.weekgrid th:first-child,.weekgrid td:first-child{position:sticky;left:0;background:#102842;z-index:1}.folder{width:100%;text-align:left;margin:6px 0;background:#183353}.weekgrid td,.weekgrid th{padding:6px}@media print{.nav,.top,button{display:none!important}body,.card{background:white;color:black}.tablewrap{overflow:visible}.muted,p{color:#444}} </style></head><body><main class="app"><header class="top"><div class="brand"><img src="/logo.jpg" alt="South West Earthworks logo"><div><div class="eyebrow">SOUTH WEST EARTHWORKS</div><h1>CREW HUB</h1></div></div><button class="alt" id="logout" style="display:none" onclick="logout()">Log out</button></header><div id="screen"></div></main><nav class="nav hidden" id="nav"><button onclick="go('home')" id="n-home"> <b>⌂</b>Home</button><button onclick="go('timesheet')" id="n-timesheet"><b>◷</b>Timesheet</button><button onclick="go('docket')" id="n-docket"><b>▤</b>Plant & Materials</button><button onclick="go('history')" id="n-history"><b>◴</b>History</button><button onclick="go('office')" id="n-office" class="hidden"><b>▦</b>Office</button></nav><script>
let me=null,records=[],catalog=[],users=[],page='home',signature='',editing=null;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=async(url,opts={})=>{const r=await fetch('/api'+url,{headers:{'Content-Type':'application/json'},...opts});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d};
const post=(url,data)=>api(url,{method:'POST',body:JSON.stringify(data)});
const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Australia/Melbourne'});
const monday=()=>{let d=new Date(),dow=(d.getDay()+6)%7;d.setDate(d.getDate()-dow);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const hours=d=>{if(d.kind!=='work'||!d.start||!d.finish)return 0;let a=d.start.split(':').map(Number),b=d.finish.split(':').map(Number);return Math.max(0,((b[0]*60+b[1])-(a[0]*60+a[1]))/60-(+d.break||0))};
const select=(kind,extra='')=>`<select ${extra}>${catalog.filter(c=>c.kind===kind).map(c=>`<option value="${esc(c.name)}">${esc(c.name)}</option>`).join('')}</select>`;
async function refresh(){records=await api('/records');catalog=await api('/catalog');if(me.role==='manager')users=await api('/users')}
function notify(s,error=false){let n=document.createElement('div');n.className='notice'+(error?' bad':'');n.textContent=s;$('#screen').prepend(n);setTimeout(()=>n.remove(),4500)}
function go(p){if(draft&&$('#saveStatus')&&p!=='docket'){if(saving||dirty&&!confirm('Leave with unsaved changes?'))return;clearTimeout(timer);draft=null}$('#screen').oninput=null;page=p;document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));$('#n-'+p)?.classList.add('active');if(p==='home')home();if(p==='timesheet')timesheet();if(p==='docket')docket();if(p==='history')history();if(p==='office')office()}
function login(){ $('#screen').innerHTML=`<section class="card" style="max-width:430px;margin:50px auto"><h2>Welcome to SWE Crew</h2><p>Enter your employee name and 4-digit PIN.</p><form id="loginform"><label>Employee name</label><input id="username" required autocomplete="username" placeholder="e.g. Brandon"><label>4-digit PIN</label><input id="pin" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" required autocomplete="current-password"><div class="actions"><button>Sign in →</button></div></form></section>`;$('#loginform').onsubmit=async e=>{e.preventDefault();try{me=await post('/login',{name:$('#username').value,pin:$('#pin').value});await start()}catch(err){notify(err.message,true)}}}
async function start(){await refresh();$('#logout').style.display='block';$('#nav').classList.remove('hidden');$('#n-office').classList.toggle('hidden',me.role!=='manager');go('home')}
async function logout(){if(saving||draft&&dirty&&!confirm('Leave with unsaved changes?'))return;clearTimeout(timer);draft=null;await post('/logout',{});me=null;$('#nav').classList.add('hidden');$('#logout').style.display='none';login()}
function home(){let mine=records.filter(r=>r.user_id===me.id),submitted=mine.filter(r=>r.status==='submitted'||r.status==='approved').length;$('#screen').innerHTML=`<section class="card hero"><div class="eyebrow" style="color:#e4f4ff">EMPLOYEE PORTAL</div><h1>G'day, ${esc(me.name)} 👋</h1><p>Record your week, plant hours and materials in one place.</p></section><section class="grid"><button class="tile" onclick="go('timesheet')"><span>◷</span>Weekly timesheet<small>Hours & signature</small></button><button class="tile" onclick="go('docket')"><span>▤</span>Plant & materials<small>Job dockets</small></button><button class="tile" onclick="go('history')"><span>◴</span>My history<small>${submitted} submitted</small></button>${me.role==='manager'?'<button class="tile" onclick="go(\'office\')"><span>▦</span>Office dashboard<small>Review submissions</small></button>':''}</section><section class="card"><h2>My recent submissions</h2>${mine.slice(0,4).map(r=>`<div class="line row"><div><b>${r.type==='timesheet'?'Weekly timesheet':'Plant & materials'}</b><div class="muted">${esc(r.week||r.date)}</div></div><span class="pill">${esc(r.status)}</span></div>`).join('')||'<p>No records yet. Start your first timesheet.</p>'}</section>`}
function timesheet(){editing=null;signature='';let mon=monday();$('#screen').innerHTML=`<section class="card"><h2>Weekly timesheet</h2><label>Week commencing (Monday)</label><input id="week" type="date" value="${mon}" onchange="buildDays()"><div id="days"></div><div class="row"><b>Weekly total</b><span class="number" id="total">0.00 hrs</span></div><h3>Employee signature</h3><p class="muted">Sign with your finger. Signature is required before submitting.</p><canvas id="sig" class="signature"></canvas><div class="actions"><button class="alt" onclick="clearSig()">Clear signature</button><button onclick="saveTimesheet(false)">Save draft</button><button onclick="saveTimesheet(true)">Sign & submit</button></div></section>`;buildDays();setupSig()}
function buildDays(){const mon=$('#week').value;const base=new Date(mon+'T12:00:00');$('#days').innerHTML=Array.from({length:7},(_,i)=>{let d=new Date(base);d.setDate(d.getDate()+i);let day=d.toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'short'});return `<div class="day" data-day="${i}"><div class="row"><b>${day}</b><b class="muted" id="h${i}">0.00 hrs</b></div><label>Day type</label><select class="kind" onchange="calc()">${['work','holiday','public holiday','sick leave','day off'].map(x=>`<option value="${x}" ${i>4&&x==='day off'?'selected':''}>${x}</option>`).join('')}</select><div class="fields"><div><label>Start</label><input type="time" class="start" onchange="calc()"></div><div><label>Finish</label><input type="time" class="finish" onchange="calc()"></div><div><label>Break (hours)</label><input type="number" min="0" step="0.25" class="break" value="0" oninput="calc()"></div></div><label>Description of works (press Enter for new job)</label><textarea class="desc" placeholder="Job 1 – work completed\nJob 2 – work completed"></textarea></div>`}).join('');calc()}
function daysData(){return [...document.querySelectorAll('[data-day]')].map(el=>({kind:el.querySelector('.kind').value,start:el.querySelector('.start').value,finish:el.querySelector('.finish').value,break:+el.querySelector('.break').value||0,description:el.querySelector('.desc').value}))}
function calc(){let ds=daysData();ds.forEach((d,i)=>$('#h'+i).textContent=hours(d).toFixed(2)+' hrs');$('#total').textContent=ds.reduce((s,d)=>s+hours(d),0).toFixed(2)+' hrs'}
function setupSig(){let c=$('#sig'),ctx=c.getContext('2d');c.width=c.clientWidth*devicePixelRatio;c.height=130*devicePixelRatio;ctx.scale(devicePixelRatio,devicePixelRatio);ctx.strokeStyle='#0d2b52';ctx.lineWidth=2.6;ctx.lineCap='round';let down=false;const pos=e=>{let r=c.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]};c.onpointerdown=e=>{down=true;c.setPointerCapture(e.pointerId);ctx.beginPath();ctx.moveTo(...pos(e));ctx.lineTo(...pos(e));ctx.stroke();signature='drawn'};c.onpointermove=e=>{if(down){ctx.lineTo(...pos(e));ctx.stroke()}};c.onpointerup=()=>down=false}
function clearSig(){let c=$('#sig');c.getContext('2d').clearRect(0,0,c.width,c.height);signature=''}
async function saveTimesheet(submit){try{let data={days:daysData(),signature:signature?$('#sig').toDataURL('image/png'):''};if(submit&&!signature)throw Error('Please sign your timesheet first');let week=$('#week').value;let r=editing? (await api('/records/'+editing,{method:'PUT',body:JSON.stringify({data})}),{id:editing}):await post('/records',{type:'timesheet',date:week,week,data});if(submit)await post('/records/'+r.id+'/submit',{});await refresh();go('history');notify(submit?'Timesheet submitted to the office':'Draft saved')}catch(e){notify(e.message,true)}}
let machineRows=0,materialRows=0;
function legacyDocket(){machineRows=0;materialRows=0;$('#screen').innerHTML=`<section class="card"><h2>Plant & materials docket</h2><div class="fields"><div><label>Date</label><input type="date" id="ddate" value="${today()}"></div><div><label>Job / site</label>${select('job','id="djob"')}</div></div><h3>Machines used</h3><div id="machines"></div><button class="alt" onclick="addLine('machine')">+ Add machine</button><h3>Materials used</h3><div id="materials"></div><button class="alt" onclick="addLine('material')">+ Add material</button><label>Notes</label><textarea id="dnotes" placeholder="Additional details, delivery docket numbers, etc."></textarea><div class="actions"><button onclick="saveDocket(false)">Save draft</button><button onclick="saveDocket(true)">Submit docket</button></div></section>`;addLine('machine');addLine('material')}
function addLine(kind){const target=kind==='machine'?'machines':'materials',unit=kind==='machine'?'Hours':'Quantity';let el=document.createElement('div');el.className='day entry';el.innerHTML=`<div class="fields"><div><label>${kind==='machine'?'Machine':'Material'}</label>${select(kind,'class="itemname"')}</div><div><label>${unit}</label><input type="number" min="0" step="0.1" class="qty" value="0"></div>${kind==='material'?'<div><label>Unit</label><select class="unit"><option>tonnes</option><option>m³</option><option>loads</option><option>bags</option><option>litres</option></select></div>':''}</div><button class="alt" style="margin-top:8px" onclick="this.closest('.entry').remove()">Remove</button>`;$('#'+target).append(el)}
function entries(id){return [...document.querySelectorAll('#'+id+' .entry')].map(el=>({name:el.querySelector('.itemname').value,qty:+el.querySelector('.qty').value,unit:el.querySelector('.unit')?.value||(id==='machines'?'hours':'tonnes')})).filter(x=>x.qty>0)}
async function saveDocket(submit){try{const date=$('#ddate').value,data={job:$('#djob').value,machines:entries('machines'),materials:entries('materials'),notes:$('#dnotes').value};if(!data.machines.length&&!data.materials.length)throw Error('Enter at least one machine or material quantity');let r=await post('/records',{type:'docket',date,data});if(submit)await post('/records/'+r.id+'/submit',{});await refresh();go('history');notify(submit?'Docket submitted to the office':'Draft saved')}catch(e){notify(e.message,true)}}
function legacyHistory(){let mine=records.filter(r=>r.user_id===me.id);$('#screen').innerHTML=`<section class="card"><h2>My submissions</h2><p>All your saved timesheets and plant/material dockets.</p>${mine.map(r=>`<div class="line"><div class="row"><div><b>${r.type==='timesheet'?'Weekly timesheet':'Plant & materials'}</b><div class="muted">${esc(r.week||r.date)} · ${esc(r.data.job||'')}</div></div><span class="pill">${esc(r.status)}</span></div><div class="actions"><button class="alt" onclick="viewRecord(${r.id})">View details</button>${['draft','returned'].includes(r.status)?`<button onclick="submitRecord(${r.id})">Submit</button>`:''}</div></div>`).join('')||'<p>No entries yet.</p>'}</section>`}
function legacyViewRecord(id){let r=records.find(x=>x.id===id);let d=r.data;let content=r.type==='timesheet'?`<p>Total: <b>${d.days.reduce((s,x)=>s+hours(x),0).toFixed(2)} hours</b></p>${d.days.map((x,i)=>`<div class="line"><b>${['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'][i]} · ${hours(x).toFixed(2)} hrs</b><p>${esc(x.kind)} · ${esc(x.start)}–${esc(x.finish)} · break ${esc(x.break)}</p><div style="white-space:pre-wrap">${esc(x.description)}</div></div>`).join('')}${d.signature?`<p>Signed:</p><img style="width:100%;max-width:380px;background:white;border-radius:12px" src="${d.signature}">`:''}`:`<p>Job: ${esc(d.job)}</p><h3>Machines</h3>${d.machines.map(x=>`<p>${esc(x.name)}: ${x.qty} hours</p>`).join('')}<h3>Materials</h3>${d.materials.map(x=>`<p>${esc(x.name)}: ${x.qty} ${esc(x.unit)}</p>`).join('')}<p>${esc(d.notes)}</p>`;$('#screen').innerHTML=`<section class="card"><button class="alt" onclick="go('${me.role==='manager'?'office':'history'}')">← Back</button><h2>${esc(r.employee)} · ${esc(r.type)}</h2><span class="pill">${esc(r.status)}</span>${content}<div class="actions"><button class="alt" onclick="audit(${id})">View change history</button></div><div id="audit"></div></section>`}
async function audit(id){let x=await api('/audit/'+id);$('#audit').innerHTML=x.map(a=>`<div class="line muted">${esc(a.at)} · ${esc(a.actor)} · ${esc(a.action)} ${esc(a.details)}</div>`).join('')}
async function submitRecord(id){try{await post('/records/'+id+'/submit',{});await refresh();go('history');notify('Submitted')}catch(e){notify(e.message,true)}}
function legacyOffice(){if(me.role!=='manager')return go('home');let waiting=records.filter(r=>r.status==='submitted'),allH=records.filter(r=>r.type==='timesheet').reduce((s,r)=>s+r.data.days.reduce((a,d)=>a+hours(d),0),0),plant=records.filter(r=>r.type==='docket').reduce((s,r)=>s+r.data.machines.reduce((a,d)=>a+d.qty,0),0);$('#screen').innerHTML=`<section class="card hero"><h2>Office dashboard</h2><p>Shared live submissions from your crew.</p></section><section class="grid"><div class="card"><div class="muted">Submitted for review</div><div class="number">${waiting.length}</div></div><div class="card"><div class="muted">Labour hours</div><div class="number">${allH.toFixed(1)}</div></div><div class="card"><div class="muted">Plant hours</div><div class="number">${plant.toFixed(1)}</div></div><div class="card"><div class="muted">Employees</div><div class="number">${users.filter(u=>u.active).length}</div></div></section><section class="card"><div class="row"><h2>Submissions</h2><button onclick="location.href='/api/export'">Export CSV ↓</button></div>${records.map(r=>`<div class="line"><div class="row"><div><b>${esc(r.employee)}</b> · ${esc(r.type)}<div class="muted">${esc(r.week||r.date)}</div></div><span class="pill">${esc(r.status)}</span></div><div class="actions"><button class="alt" onclick="viewRecord(${r.id})">View</button>${r.status==='submitted'?`<button onclick="review(${r.id},'approved')">Approve</button><button class="danger" onclick="review(${r.id},'returned')">Return</button>`:''}</div></div>`).join('')||'<p>No submissions yet.</p>'}</section><section class="card"><h2>Add employee</h2><form id="newuser" class="fields"><div><label>Employee name</label><input name="name" required></div><div><label>4-digit PIN</label><input name="pin" inputmode="numeric" pattern="[0-9]{4}" required></div><div><label>Role</label><select name="role"><option value="employee">Employee</option><option value="manager">Manager</option></select></div><div style="align-self:end"><button>Add employee</button></div></form></section><section class="card"><h2>Add job, machine or material</h2><form id="newcat" class="fields"><div><label>Type</label><select name="kind"><option value="job">Job</option><option value="machine">Machine</option><option value="material">Material</option></select></div><div><label>Name</label><input name="name" required></div><div><label>Unit (optional)</label><input name="unit"></div><div style="align-self:end"><button>Add item</button></div></form></section>`;$('#newuser').onsubmit=async e=>{e.preventDefault();try{await post('/users',Object.fromEntries(new FormData(e.target)));await refresh();officeSettings();notify('Employee added')}catch(e){notify(e.message,true)}};$('#newcat').onsubmit=async e=>{e.preventDefault();try{await post('/catalog',Object.fromEntries(new FormData(e.target)));await refresh();officeSettings();notify('Item added')}catch(e){notify(e.message,true)}}}
async function review(id,status){try{await post('/records/'+id+'/review',{status});await refresh();office();notify('Record '+status)}catch(e){notify(e.message,true)}}

const weekOf=v=>{let d=new Date(v+'T12:00:00Z');if(!Number.isFinite(+d))return monday();d.setUTCDate(d.getUTCDate()-(d.getUTCDay()+6)%7);return d.toISOString().slice(0,10)};
const datePlus=(v,n)=>{let d=new Date(v+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const fmt=v=>new Date(v+'T12:00:00').toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'});
const weekTitle=w=>fmt(w)+' – '+fmt(datePlus(w,6));
const recordWeek=r=>weekOf(r.week||r.date);
const totalPlant=r=>(r.data.machines||[]).reduce((a,x)=>a+Number(x.qty||0),0);
let officeEmp=null,officeWeek=null,officeJob=null,officeMode='employees',draft=null,draftId=null,saving=false,dirty=false;
function recordCard(r){return `<div class="line"><div class="row"><div><b>${r.type==='timesheet'?'Weekly timesheet':esc(r.data.job||'Docket')}</b><div class="muted">${esc(r.employee)} · ${esc(r.date)} · ${r.type==='timesheet'?r.data.days.reduce((a,d)=>a+hours(d),0).toFixed(2):totalPlant(r).toFixed(2)} hrs</div></div><span class="pill">${esc(r.status)}</span></div><div class="actions"><button class="alt" onclick="viewRecord(${r.id})">View</button>${r.user_id===me.id&&['draft','returned'].includes(r.status)?`<button onclick="${r.type==='docket'?'editDocket':'editTimesheet'}(${r.id})">Continue editing</button>`:''}${me.role==='manager'&&r.status==='submitted'?`<button onclick="review(${r.id},'approved')">Approve</button><button class="danger" onclick="review(${r.id},'returned')">Return</button>`:''}</div></div>`}
function office(){if(me.role!=='manager')return go('home');let heading='<section class="card hero"><h2>Office dashboard</h2><p>Employee and project records</p></section>';let nav='<div class="actions"><button onclick="officeReset(&quot;employees&quot;)">Employees</button><button class="alt" onclick="officeReset(&quot;jobs&quot;)">Jobs</button><button class="alt" onclick="officeSettings()">Settings</button><button class="alt" onclick="refreshOffice()">Refresh</button></div>';let body='';let visible=records.filter(r=>r.status!=='draft');if(officeMode==='jobs'){let jobs=[...new Set([...catalog.filter(c=>c.kind==='job').map(c=>c.name),...visible.filter(r=>r.type==='docket').map(r=>r.data.job)])];if(officeJob===null)body=jobs.map((j,i)=>`<button class="folder" data-job="${esc(j)}" onclick="officeJob=this.dataset.job;office()">▤ ${esc(j)}</button>`).join('');else{let rr=visible.filter(r=>r.type==='docket'&&r.data.job===officeJob);body=`<button class="alt" onclick="officeJob=null;office()">← Jobs</button><h2>${esc(officeJob)}</h2><p>Total plant hours: ${rr.reduce((a,r)=>a+totalPlant(r),0).toFixed(2)}</p>`+summary(rr)+rr.map(recordCard).join('')}}else if(officeEmp===null){body='<h2>Employees</h2>'+users.map(u=>`<button class="folder" onclick="officeEmp=${u.id};officeWeek=null;office()">${esc(u.name)} <span class="muted"> · ${visible.filter(r=>r.user_id===u.id&&r.status==='submitted').length} awaiting review</span></button>`).join('')+'<div class="actions"><button class="alt" onclick="location.href=&quot;/api/export&quot;">Export all CSV</button><button class="alt" onclick="payrollPick()">Weekly payroll CSV</button></div>'}else{let rr=visible.filter(r=>r.user_id===officeEmp);let name=users.find(u=>u.id===officeEmp)?.name||'Employee';body=`<button class="alt" onclick="officeEmp=null;officeWeek=null;office()">← Employees</button><h2>${esc(name)}</h2>`;if(!officeWeek){let weeks=[...new Set([monday(),...rr.map(recordWeek)])].sort().reverse();body+=weeks.map(w=>`<button class="folder" data-week="${w}" onclick="officeWeek=this.dataset.week;office()">📁 ${weekTitle(w)} <span class="muted"> · ${rr.filter(r=>recordWeek(r)===w).length} records</span></button>`).join('')}else{rr=rr.filter(r=>recordWeek(r)===officeWeek);body+=`<button class="alt" onclick="officeWeek=null;office()">← Weekly folders</button><h3>${weekTitle(officeWeek)}</h3><p>Labour: ${rr.filter(r=>r.type==='timesheet').reduce((a,r)=>a+r.data.days.reduce((b,d)=>b+hours(d),0),0).toFixed(2)} hrs · Plant: ${rr.reduce((a,r)=>a+totalPlant(r),0).toFixed(2)} hrs</p>`+ (rr.map(recordCard).join('')||'<p>No submissions this week.</p>')}}$('#screen').innerHTML=heading+nav+'<section class="card">'+body+'</section>'}
function officeReset(mode){officeMode=mode;officeEmp=null;officeWeek=null;officeJob=null;office()}
async function refreshOffice(){try{await refresh();office()}catch(e){notify(e.message,true)}}
function summary(rr){let map=new Map();for(let r of rr)for(let x of [...(r.data.machines||[]),...(r.data.materials||[])]){let k=x.name+' ('+(x.unit||'hours')+')';map.set(k,(map.get(k)||0)+Number(x.qty))}return [...map].map(([k,v])=>`<p>${esc(k)}: ${v.toFixed(2)}</p>`).join('')}
function payrollPick(){let w=prompt('Week commencing (YYYY-MM-DD)',monday());if(!w||!/^\d{4}-\d{2}-\d{2}$/.test(w))return;w=weekOf(w);let rr=records.filter(r=>r.type==='timesheet'&&r.status==='approved'&&recordWeek(r)===w);let rows=[['Employee','Week','Approved labour hours'],...users.map(u=>[u.name,w,rr.filter(r=>r.user_id===u.id).reduce((a,r)=>a+r.data.days.reduce((b,d)=>b+hours(d),0),0).toFixed(2)])];downloadCsv(rows,'SWE-payroll-'+w+'.csv')}
function downloadCsv(rows,name){let b=new Blob([rows.map(row=>row.map(x=>'"'+String(x??'').replace(/^[=+@-]/,"'$&").replaceAll('"','""')+'"').join(',')).join('\r\n')],{type:'text/csv'});let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function officeSettings(){legacyOffice();let forms=[...$('#screen').querySelectorAll('section')].slice(-2);$('#screen').replaceChildren(...forms);$('#screen').insertAdjacentHTML('afterbegin','<button class="alt" onclick="office()">← Office</button>')}
function history(){let mine=records.filter(r=>r.user_id===me.id);$('#screen').innerHTML='<section class="card"><h2>My records</h2>'+ (mine.map(recordCard).join('')||'<p>No records yet.</p>')+'</section>'}
function docket(){if(draft&&$('#saveStatus')){leaveDocket();return}let mine=records.filter(r=>r.user_id===me.id&&r.type==='docket');$('#screen').innerHTML='<section class="card hero"><h2>My job dockets</h2><p>Keep a separate weekly record for each job.</p></section><button onclick="editDocket()">+ New weekly docket</button><section class="card"><h2>Active dockets</h2>'+ (mine.filter(r=>['draft','returned'].includes(r.status)).map(recordCard).join('')||'<p>No active dockets.</p>')+'</section><section class="card"><h2>Submitted dockets</h2>'+mine.filter(r=>!['draft','returned'].includes(r.status)).map(recordCard).join('')+'</section>'}
const daysShort=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
function col(name='',unit='hours',values=Array(7).fill('')){return {name,unit,values:[...values]}}
function editDocket(id){let r=records.find(x=>x.id===id);draftId=r?.id||null;let d=r?.data||{};let w=r?recordWeek(r):monday();let old=(items,unit)=>(items||[]).map(x=>{let v=Array(7).fill('');v[Math.max(0,Math.min(6,Math.round((Date.parse(r.date)-Date.parse(w))/86400000)))]=x.qty;return col(x.name,x.unit||unit,v)});draft={week:w,job:d.job||'',customer:d.customer||'',location:d.location||'',notes:d.notes||'',machineCols:d.machineCols|| (r?old(d.machines,'hours'):[col()]),materialCols:d.materialCols||(r?old(d.materials,'tonnes'):[col('','tonnes')])};dirty=false;renderDocket()}
function renderDocket(){let d=draft;$('#screen').innerHTML=`<section class="card"><button class="alt" onclick="leaveDocket()">← My dockets</button><h2>Weekly machine hours & materials</h2><p>${esc(me.name)} · ${draftId?'Docket #'+draftId:'New docket'}</p><div class="fields">${[['job','Job / Project'],['customer','Customer'],['location','Location']].map(([k,l])=>`<div><label>${l}</label><input data-field="${k}" value="${esc(d[k])}" ${k==='job'?'list="joblist"':''}></div>`).join('')}<div><label>Week commencing</label><input type="date" data-field="week" value="${d.week}" ${draftId?'disabled':''}></div></div><datalist id="joblist">${catalog.filter(c=>c.kind==='job').map(c=>`<option value="${esc(c.name)}">`).join('')}</datalist><datalist id="machlist">${catalog.filter(c=>c.kind==='machine').map(c=>`<option value="${esc(c.name)}">`).join('')}</datalist>${gridDocket('machineCols','Machine hours')}${gridDocket('materialCols','Materials used')}<label>Notes</label><textarea data-field="notes">${esc(d.notes)}</textarea><p id="saveStatus" class="muted">${dirty?'Unsaved changes':'Save draft to keep this docket online.'}</p><div class="actions"><button onclick="saveWeekly(false)">Save draft</button><button onclick="saveWeekly(true)">Submit docket</button></div></section>`;$('#screen').oninput=e=>{let x=e.target,k=x.dataset.field;if(k){draft[k]=k==='week'&&x.value?weekOf(x.value):x.value;if(k==='week')x.value=draft.week}else if(x.dataset.group){let c=draft[x.dataset.group][+x.dataset.col];if(x.dataset.day!==undefined)c.values[+x.dataset.day]=x.value;else c[x.dataset.prop]=x.value}else return;dirty=true;updateTotals();$('#saveStatus').textContent='Unsaved changes — saving shortly';scheduleSave()}}
function gridDocket(k,title){let cols=draft[k];return `<h3>${title}</h3><div class="tablewrap"><table class="weekgrid"><thead><tr><th>Day</th>${cols.map((c,i)=>`<th><input placeholder="${k==='machineCols'?'Machine':'Material description'}" value="${esc(c.name)}" data-group="${k}" data-col="${i}" data-prop="name" ${k==='machineCols'?'list="machlist"':''}>${k==='materialCols'?`<input aria-label="Unit" placeholder="Unit" value="${esc(c.unit)}" data-group="${k}" data-col="${i}" data-prop="unit">`:''}<button class="alt" onclick="removeCol('${k}',${i})">Remove</button></th>`).join('')}</tr></thead><tbody>${daysShort.map((day,j)=>`<tr><td>${day}</td>${cols.map((c,i)=>`<td><input aria-label="${day} quantity" type="number" min="0" step="any" value="${esc(c.values[j])}" data-group="${k}" data-col="${i}" data-day="${j}"></td>`).join('')}</tr>`).join('')}<tr><th>Total</th>${cols.map((c,i)=>`<th id="${k}${i}">${sumCol(c).toFixed(2)}</th>`).join('')}</tr></tbody></table></div><button class="alt" onclick="draft.${k}.push(col('','${k==='machineCols'?'hours':'tonnes'}'));dirty=true;renderDocket();scheduleSave()">+ Add ${k==='machineCols'?'machine':'material'}</button>`}
function sumCol(c){return c.values.reduce((a,v)=>a+(Number(v)||0),0)}
function updateTotals(){for(let k of ['machineCols','materialCols'])draft[k].forEach((c,i)=>{let el=$('#'+k+i);if(el)el.textContent=sumCol(c).toFixed(2)})}
function removeCol(k,i){if(sumCol(draft[k][i])&&!confirm('Remove this column and its quantities?'))return;draft[k].splice(i,1);dirty=true;renderDocket();scheduleSave()}
let timer;function scheduleSave(){clearTimeout(timer);timer=setTimeout(()=>{if(draft&&dirty&&draft.job.trim()&&$('#saveStatus'))saveWeekly(false,true)},1800)}
async function saveWeekly(submit,auto=false){if(saving)return;clearTimeout(timer);try{if(!draft.job.trim())throw Error('Enter a job name');if(!draft.week)throw Error('Select a week');let all=[...draft.machineCols,...draft.materialCols];for(let c of all){if(c.values.some(v=>v!==''&&(!Number.isFinite(+v)||+v<0)))throw Error('Invalid quantity');if(sumCol(c)>0&&!c.name.trim())throw Error('Name each used column')}let pack=cols=>cols.filter(c=>c.name.trim()).map(c=>({name:c.name.trim(),unit:c.unit,qty:sumCol(c)}));let data={...draft,layout:'weekly',machines:pack(draft.machineCols),materials:pack(draft.materialCols)};if(submit&&!data.machines.some(x=>x.qty>0)&&!data.materials.some(x=>x.qty>0))throw Error('Enter at least one quantity');saving=true;let snap=JSON.stringify(draft);if(draftId)await api('/records/'+draftId,{method:'PUT',body:JSON.stringify({data})});else{let r=await post('/records',{type:'docket',date:draft.week,week:draft.week,data});draftId=r.id;let el=$('[data-field=week]');if(el)el.disabled=true}dirty=JSON.stringify(draft)!==snap;if(submit){if(dirty)throw Error('Changes made during save; submit again');await post('/records/'+draftId+'/submit',{})}await refresh();if(submit){draft=null;go('docket');notify('Docket submitted')}else if($('#saveStatus'))$('#saveStatus').textContent=dirty?'Unsaved changes':'Draft saved online';if(dirty)scheduleSave()}catch(e){if($('#saveStatus'))$('#saveStatus').textContent='Not saved: '+e.message;if(!auto)notify(e.message,true)}finally{saving=false}}
function leaveDocket(){if(saving){notify('Saving, please wait');return}if(dirty&&!confirm('Leave with unsaved changes?'))return;clearTimeout(timer);draft=null;go('docket')}
function viewRecord(id){let r=records.find(x=>x.id===id);if(r.type!=='docket'||r.data.layout!=='weekly'){legacyViewRecord(id);return}let d=r.data;let table=(cols,title)=>`<h3>${title}</h3><div class="tablewrap"><table><tr><th>Day</th>${cols.map(c=>`<th>${esc(c.name)} (${esc(c.unit)})</th>`).join('')}</tr>${daysShort.map((day,i)=>`<tr><td>${day}</td>${cols.map(c=>`<td>${esc(c.values[i])}</td>`).join('')}</tr>`).join('')}<tr><th>Total</th>${cols.map(c=>`<th>${sumCol(c).toFixed(2)}</th>`).join('')}</tr></table></div>`;$('#screen').innerHTML=`<section class="card"><button class="alt" onclick="go('${me.role==='manager'?'office':'history'}')">← Back</button><h2>${esc(d.job)} · #${r.id}</h2><p>${esc(r.employee)} · ${weekTitle(recordWeek(r))} · ${esc(r.status)}</p><p>${esc(d.customer)} · ${esc(d.location)}</p>${table(d.machineCols,'Machine hours')}${table(d.materialCols,'Materials used')}<p>${esc(d.notes)}</p><div class="actions"><button class="alt" onclick="window.print()">Print / PDF</button><button class="alt" onclick="audit(${id})">Audit history</button></div><div id="audit"></div></section>`}
function editTimesheet(id){let r=records.find(x=>x.id===id);timesheet();editing=id;$('#week').value=r.week||r.date;$('#week').disabled=true;buildDays();r.data.days.forEach((d,i)=>{let el=$('[data-day="'+i+'"]');for(let [k,c] of [['kind','kind'],['start','start'],['finish','finish'],['break','break'],['description','desc']])el.querySelector('.'+c).value=d[k]??''});calc();if(r.data.signature){let img=new Image();img.onload=()=>{let c=$('#sig');if(c){c.getContext('2d').drawImage(img,0,0,c.clientWidth,130);signature='drawn'}};img.src=r.data.signature}}

(async()=>{try{me=await api('/me');await start()}catch{login()}})();if('serviceWorker'in navigator)navigator.serviceWorker.register('/service-worker.js').catch(()=>{});
</script></body></html>
