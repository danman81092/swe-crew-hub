<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f7fb"><link rel="manifest" href="/manifest.webmanifest"><title>SWE Crew</title><style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#edf6ff;background:#071326}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{border:0;border-radius:13px;background:#137cf5;color:white;font-weight:750;padding:13px 17px;cursor:pointer}button.alt{background:#183353}button.danger{background:#8c3041}button:disabled{opacity:.4}input,select,textarea{background:#0d2139;color:#fff;border:1px solid #35516e;border-radius:11px;padding:12px;width:100%;min-height:44px}textarea{min-height:88px;resize:vertical}label{display:block;color:#a9c6e8;font-size:12px;font-weight:750;margin:10px 0 5px}.app{max-width:1040px;margin:auto;padding:16px 16px 94px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0 16px}.brand{display:flex;align-items:center;gap:10px}.brand img{height:58px;width:58px;object-fit:cover;border-radius:14px}.eyebrow{color:#59b5ff;letter-spacing:.1em;font-size:11px;font-weight:800}h1{font-size:25px;margin:3px 0}h2{font-size:19px;margin:0 0 12px}h3{margin:10px 0}p{color:#a9c6e8}.card{background:linear-gradient(145deg,#142b49,#0d1f36);border:1px solid #28466b;border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 8px 24px #0002}.hero{background:linear-gradient(120deg,#075fd7,#14a4ff);border:0}.hero p{color:#e4f4ff}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.tile{padding:20px;text-align:left;min-height:125px;background:#183a63;border-radius:18px;display:flex;flex-direction:column;justify-content:space-between}.tile span{font-size:26px}.tile small{color:#b9d9ff}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.stack{display:grid;gap:10px}.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.pill{font-size:11px;background:#164f85;color:#bde1ff;padding:6px 10px;border-radius:30px;font-weight:700}.nav{position:fixed;bottom:0;left:0;right:0;background:#08182d;border-top:1px solid #2b496c;display:flex;justify-content:center;padding:8px 6px max(8px,env(safe-area-inset-bottom));z-index:5}.nav button{background:transparent;color:#9db6d5;flex:1;max-width:220px;padding:8px 3px;font-size:11px}.nav button.active{color:#4eaaff}.nav b{display:block;font-size:21px}.day{padding:14px;background:#0a1d34;border:1px solid #244363;border-radius:15px;margin:10px 0}.muted{color:#9fb7d4;font-size:12px}.line{border-bottom:1px solid #2b486a;padding:12px 0}.hidden{display:none!important}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.actions button{flex:1}.signature{width:100%;height:130px;touch-action:none;background:#f6fbff;border-radius:12px;border:2px dashed #58a8ff}.number{font-size:27px;font-weight:850;color:#65bdff}.notice{padding:12px;border-radius:12px;background:#123d60;color:#c9e9ff;margin:10px 0}.bad{background:#5e2637}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:10px;text-align:left;border-bottom:1px solid #2b486a}a{color:#6cbcff}@media(min-width:720px){.grid{grid-template-columns:repeat(4,1fr)}.fields{grid-template-columns:repeat(4,1fr)}.app{padding:24px 24px 100px}}

:root:not([data-theme="dark"]){color:#14253a;background:#f4f7fb;color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
:root:not([data-theme="dark"]) .card{background:#fff;border-color:#dce5ef;box-shadow:0 4px 16px #183b6410}
:root:not([data-theme="dark"]) .hero{background:linear-gradient(120deg,#0767d8,#1189ef);border:0;color:#fff}
:root:not([data-theme="dark"]) .hero p{color:#f0f8ff}
:root:not([data-theme="dark"]) .eyebrow{color:#086dcf}
:root:not([data-theme="dark"]) .hero .eyebrow{color:#e4f4ff}
:root:not([data-theme="dark"]) label,:root:not([data-theme="dark"]) p,:root:not([data-theme="dark"]) .muted{color:#52647b}
:root:not([data-theme="dark"]) input,:root:not([data-theme="dark"]) select,:root:not([data-theme="dark"]) textarea{background:#fff;color:#14253a;border-color:#b9c9db}
:root:not([data-theme="dark"]) input:focus,:root:not([data-theme="dark"]) select:focus,:root:not([data-theme="dark"]) textarea:focus{outline:2px solid #1385ef;outline-offset:1px}

</style></head><body><main class="app"><header class="top"><div class="brand"><img src="/logo.jpg" alt="South West Earthworks logo"><div><div class="eyebrow">SOUTH WEST EARTHWORKS</div><h1>CREW HUB · V2.5</h1></div></div><div class="header-actions"><button class="alt" id="themeToggle" onclick="toggleTheme()" aria-label="Switch appearance">☾ Dark</button><button class="alt" id="logout" style="display:none" onclick="logout()">Log out</button></div></header><div id="screen"></div></main><nav class="nav hidden" id="nav"><button onclick="go('home')" id="n-home"> <b>⌂</b>Home</button><button onclick="go('timesheet')" id="n-timesheet"><b>◷</b>Timesheet</button><button onclick="go('docket')" id="n-docket"><b>▤</b>Plant & Materials</button><button onclick="go('history')" id="n-history"><b>◴</b>History</button><button onclick="go('office')" id="n-office" class="hidden"><b>▦</b>Office</button></nav><script>

function applyTheme(mode){document.documentElement.dataset.theme=mode;document.querySelector('meta[name="theme-color"]').content=mode==='dark'?'#071326':'#f4f7fb';document.getElementById('themeToggle').textContent=mode==='dark'?'☀ Light':'☾ Dark';try{localStorage.setItem('swe-theme',mode)}catch{}}
function toggleTheme(){applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark')}
let savedTheme='light';try{if(localStorage.getItem('swe-theme')==='dark')savedTheme='dark'}catch{}applyTheme(savedTheme);

let me=null,records=[],catalog=[],users=[],page='home',signature='',editing=null;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=async(url,opts={})=>{const r=await fetch('/api'+url,{headers:{'Content-Type':'application/json'},...opts});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d};
const post=(url,data)=>api(url,{method:'POST',body:JSON.stringify(data)});
const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Australia/Melbourne'});
const monday=()=>{let d=new Date(),dow=(d.getDay()+6)%7;d.setDate(d.getDate()-dow);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const hours=d=>{if(d.kind!=='work'||!d.start||!d.finish)return 0;let a=d.start.split(':').map(Number),b=d.finish.split(':').map(Number);return Math.max(0,((b[0]*60+b[1])-(a[0]*60+a[1]))/60-(+d.break||0))};
const select=(kind,extra='')=>`<select ${extra}>${catalog.filter(c=>c.kind===kind).map(c=>`<option value="${esc(c.name)}">${esc(c.name)}</option>`).join('')}</select>`;
async function refresh(){records=await api('/records');catalog=await api('/catalog');if(me.role==='manager')users=await api('/users')}
function notify(s,error=false){let n=document.createElement('div');n.className='notice'+(error?' bad':'');n.textContent=s;$('#screen').prepend(n);setTimeout(()=>n.remove(),4500)}
function go(p){page=p;document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));$('#n-'+p)?.classList.add('active');if(p==='home')home();if(p==='timesheet')timesheet();if(p==='docket')docket();if(p==='history')history();if(p==='office')office()}
function login(){ $('#screen').innerHTML=`<section class="card" style="max-width:430px;margin:50px auto"><h2>Welcome to SWE Crew</h2><p>Enter your employee name and 4-digit PIN.</p><form id="loginform"><label>Employee name</label><input id="username" required autocomplete="username" placeholder="e.g. Brandon"><label>4-digit PIN</label><input id="pin" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" required autocomplete="current-password"><div class="actions"><button>Sign in →</button></div></form></section>`;$('#loginform').onsubmit=async e=>{e.preventDefault();try{me=await post('/login',{name:$('#username').value,pin:$('#pin').value});await start()}catch(err){notify(err.message,true)}}}
async function start(){await refresh();$('#logout').style.display='block';$('#nav').classList.remove('hidden');$('#n-office').classList.toggle('hidden',me.role!=='manager');go('home')}
async function logout(){await post('/logout',{});me=null;$('#nav').classList.add('hidden');$('#logout').style.display='none';login()}
function home(){let mine=records.filter(r=>r.user_id===me.id),submitted=mine.filter(r=>r.status==='submitted'||r.status==='approved').length;$('#screen').innerHTML=`<section class="card hero"><div class="eyebrow" style="color:#e4f4ff">EMPLOYEE PORTAL</div><h1>G'day, ${esc(me.name)} 👋</h1><p>Record your week, plant hours and materials in one place.</p></section><section class="grid"><button class="tile" onclick="go('timesheet')"><span>◷</span>Weekly timesheet<small>Hours & signature</small></button><button class="tile" onclick="go('docket')"><span>▤</span>Plant & materials<small>Job dockets</small></button><button class="tile" onclick="go('history')"><span>◴</span>My history<small>${submitted} submitted</small></button>${me.role==='manager'?'<button class="tile" onclick="go(\'office\')"><span>▦</span>Office dashboard<small>Review submissions</small></button>':''}</section><section class="card"><h2>My recent submissions</h2>${mine.slice(0,4).map(r=>`<div class="line row"><div><b>${r.type==='timesheet'?'Weekly timesheet':'Plant & materials'}</b><div class="muted">${esc(r.week||r.date)}</div></div><span class="pill">${esc(r.status)}</span></div>`).join('')||'<p>No records yet. Start your first timesheet.</p>'}</section>`}
function timesheet(){editing=null;let mon=monday();$('#screen').innerHTML=`<section class="card"><h2>Weekly timesheet</h2><label>Week commencing (Monday)</label><input id="week" type="date" value="${mon}" onchange="buildDays()"><div id="days"></div><div class="row"><b>Weekly total</b><span class="number" id="total">0.00 hrs</span></div><h3>Employee signature</h3><p class="muted">Sign with your finger. Signature is required before submitting.</p><canvas id="sig" class="signature"></canvas><div class="actions"><button class="alt" onclick="clearSig()">Clear signature</button><button onclick="saveTimesheet(false)">Save draft</button><button onclick="saveTimesheet(true)">Sign & submit</button></div></section>`;buildDays();setupSig()}
function buildDays(){const mon=$('#week').value;const base=new Date(mon+'T12:00:00');$('#days').innerHTML=Array.from({length:7},(_,i)=>{let d=new Date(base);d.setDate(d.getDate()+i);let day=d.toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'short'});return `<div class="day" data-day="${i}"><div class="row"><b>${day}</b><b class="muted" id="h${i}">0.00 hrs</b></div><label>Day type</label><select class="kind" onchange="calc()">${['work','holiday','public holiday','sick leave','day off'].map(x=>`<option value="${x}" ${i>4&&x==='day off'?'selected':''}>${x}</option>`).join('')}</select><div class="fields"><div><label>Start</label><input type="time" class="start" onchange="calc()"></div><div><label>Finish</label><input type="time" class="finish" onchange="calc()"></div><div><label>Break (hours)</label><input type="number" min="0" step="0.25" class="break" value="0" oninput="calc()"></div></div><label>Description of works (press Enter for new job)</label><textarea class="desc" placeholder="Job 1 – work completed\nJob 2 – work completed"></textarea></div>`}).join('');calc()}
function daysData(){return [...document.querySelectorAll('[data-day]')].map(el=>({kind:el.querySelector('.kind').value,start:el.querySelector('.start').value,finish:el.querySelector('.finish').value,break:+el.querySelector('.break').value||0,description:el.querySelector('.desc').value}))}
function calc(){let ds=daysData();ds.forEach((d,i)=>$('#h'+i).textContent=hours(d).toFixed(2)+' hrs');$('#total').textContent=ds.reduce((s,d)=>s+hours(d),0).toFixed(2)+' hrs'}
function setupSig(){let c=$('#sig'),ctx=c.getContext('2d');c.width=c.clientWidth*devicePixelRatio;c.height=130*devicePixelRatio;ctx.scale(devicePixelRatio,devicePixelRatio);ctx.strokeStyle='#0d2b52';ctx.lineWidth=2.6;ctx.lineCap='round';let down=false;const pos=e=>{let r=c.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]};c.onpointerdown=e=>{down=true;c.setPointerCapture(e.pointerId);ctx.beginPath();ctx.moveTo(...pos(e));ctx.lineTo(...pos(e));ctx.stroke();signature='drawn'};c.onpointermove=e=>{if(down){ctx.lineTo(...pos(e));ctx.stroke()}};c.onpointerup=()=>down=false}
function clearSig(){let c=$('#sig');c.getContext('2d').clearRect(0,0,c.width,c.height);signature=''}
async function saveTimesheet(submit){try{let data={days:daysData(),signature:signature?$('#sig').toDataURL('image/png'):''};if(submit&&!signature)throw Error('Please sign your timesheet first');let week=$('#week').value;let r=await post('/records',{type:'timesheet',date:week,week,data});if(submit)await post('/records/'+r.id+'/submit',{});await refresh();go('history');notify(submit?'Timesheet submitted to the office':'Draft saved')}catch(e){notify(e.message,true)}}
function history(){let mine=records.filter(r=>r.user_id===me.id);$('#screen').innerHTML=`<section class="card"><h2>My submissions</h2><p>All your saved timesheets and plant/material dockets.</p>${mine.map(r=>`<div class="line"><div class="row"><div><b>${r.type==='timesheet'?'Weekly timesheet':'Plant & materials'}</b><div class="muted">${esc(r.week||r.date)} · ${esc(r.data.job||'')}</div></div><span class="pill">${esc(r.status)}</span></div><div class="actions"><button class="alt" onclick="viewRecord(${r.id})">View details</button>${['draft','returned'].includes(r.status)?`<button onclick="${r.type==='docket'?'openDocket':'submitRecord'}(${r.id})">${r.type==='docket'?'Edit docket':'Submit'}</button>`:''}</div></div>`).join('')||'<p>No entries yet.</p>'}</section>`}
function viewRecord(id){let r=records.find(x=>x.id===id);let d=r.data;let content=r.type==='timesheet'?`<p>Total: <b>${d.days.reduce((s,x)=>s+hours(x),0).toFixed(2)} hours</b></p>${d.days.map((x,i)=>`<div class="line"><b>${['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'][i]} · ${hours(x).toFixed(2)} hrs</b><p>${esc(x.kind)} · ${esc(x.start)}–${esc(x.finish)} · break ${esc(x.break)}</p><div style="white-space:pre-wrap">${esc(x.description)}</div></div>`).join('')}${d.signature?`<p>${d.adminCorrected?'Original employee signature — hours subsequently corrected by management':'Signed:'}</p><img style="width:100%;max-width:380px;background:white;border-radius:12px" src="${d.signature}">`:''}`:`<p>Job: ${esc(d.job)}</p><h3>Machines</h3>${d.machines.map(x=>`<p>${esc(x.name)}: ${x.qty} hours</p>`).join('')}<h3>Materials</h3>${d.materials.map(x=>`<p>${esc(x.name)}: ${x.qty} ${esc(x.unit)}</p>`).join('')}<p>${esc(d.notes)}</p>${photoView(d.photos)}`;$('#screen').innerHTML=`<section class="card"><button class="alt" onclick="go('${me.role==='manager'?'office':'history'}')">← Back</button><h2>${esc(r.employee)} · ${esc(r.type)}</h2><span class="pill">${esc(r.status)}</span>${content}<div class="actions"><button class="alt" onclick="audit(${id})">View change history</button></div><div id="audit"></div></section>`}
async function audit(id){let x=await api('/audit/'+id);$('#audit').innerHTML=x.map(a=>`<div class="line muted">${esc(a.at)} · ${esc(a.actor)} · ${esc(a.action)} ${esc(a.details)}</div>`).join('')}
async function submitRecord(id){try{await post('/records/'+id+'/submit',{});await refresh();go('history');notify('Submitted')}catch(e){notify(e.message,true)}}
async function review(id,status){try{await post('/records/'+id+'/review',{status});await refresh();office();notify('Record '+status)}catch(e){notify(e.message,true)}}

let officeFolder=null,officeUser=null,officeWeek=null,officeJob=null,officeMode='people',activeDocket=null;
const weekOf=v=>{let d=new Date(v+'T12:00:00Z');if(isNaN(d))return monday();d.setUTCDate(d.getUTCDate()-(d.getUTCDay()+6)%7);return d.toISOString().slice(0,10)};
const weekLabel=w=>{let d=new Date(w+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+6);return w+' – '+d.toISOString().slice(0,10)};
const recWeek=r=>weekOf(r.week||r.date);
const mineDockets=()=>records.filter(r=>r.user_id===me.id&&r.type==='docket');
const editable=r=>['draft','returned'].includes(r.status);
function docket(){activeDocket=null;$('#screen').innerHTML='<section class="card hero"><h2>My weekly dockets</h2><p>One docket per job, Monday to Sunday.</p></section><section class="card"><button onclick="openDocket()">+ Create new docket</button>'+mineDockets().map(r=>'<div class="line row"><div><b>'+esc(r.data.job)+'</b><p>'+esc(weekLabel(recWeek(r)))+' · #'+r.id+'</p></div><span class="pill">'+esc(r.status)+'</span><button class="alt" onclick="'+(editable(r)?'openDocket':'viewRecord')+'('+r.id+')">'+(editable(r)?'Open draft':'View')+'</button></div>').join('')+'</section>'}
function openDocket(id){let r=mineDockets().find(x=>x.id===id);if(r&&!editable(r))return;activeDocket=r||null;let d=r?.data||{},w=r?recWeek(r):weekOf(today());docketPhotos=structuredClone(d.photos||[]);$('#screen').innerHTML='<section class="card"><button class="alt" onclick="docket()">← My dockets</button><h2>Weekly machine & materials docket</h2><label>Employee</label><b>'+esc(me.name)+'</b><label>Week commencing Monday</label><input id="dw" type="date" value="'+w+'" '+(r?'disabled':'')+'><label>Job / project</label><input id="dj" list="jobs" value="'+esc(d.job||'')+'"><datalist id="jobs">'+catalog.filter(c=>c.kind==='job').map(c=>'<option value="'+esc(c.name)+'">').join('')+'</datalist><datalist id="machinecatalog">'+catalog.filter(c=>c.kind==='machine').map(c=>'<option value="'+esc(c.name)+'">').join('')+'</datalist><h3>Machine hours</h3><div class="tablewrap"><table><thead><tr><th>Machine</th>'+['Mon','Tue','Wed','Thu','Fri','Sat','Sun','Total',''].map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody id="dm"></tbody></table></div><button class="alt" onclick="addWeeklyRow(\'dm\')">+ Add machine</button><h3>Materials used</h3><div class="tablewrap"><table><thead><tr><th>Material</th><th>Unit</th>'+['Mon','Tue','Wed','Thu','Fri','Sat','Sun','Total',''].map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody id="dt"></tbody></table></div><button class="alt" onclick="addWeeklyRow(\'dt\')">+ Add material</button><p>Total machine hours: <b id="wh">0</b></p><label>Notes</label><textarea id="dn">'+esc(d.notes||'')+'</textarea>'+photoEditor()+'<div class="actions"><button onclick="saveWeekly(false)">Save draft</button><button onclick="saveWeekly(true)">Submit docket</button></div></section>';for(let [key,items] of [['dm',d.machines],['dt',d.materials]]){for(let x of items||[]){let daily=x.daily;if(!daily){daily=Array(7).fill(0);daily[Math.max(0,Math.min(6,Math.round((new Date(r.date)-new Date(w))/864e5)))]=x.qty}addWeeklyRow(key,{...x,daily})}if(!items?.length)addWeeklyRow(key)}weeklyCalc();renderPhotos()}
function addWeeklyRow(key,x={}){let tr=document.createElement('tr'),mat=key==='dt';tr.innerHTML='<td><input style="min-width:150px" class="wn" '+(mat?'':'list="machinecatalog"')+' placeholder="'+(mat?'Material':'Machine')+'" value="'+esc(x.name||'')+'"></td>'+(mat?'<td><input style="min-width:95px" class="wu" placeholder="Unit" value="'+esc(x.unit||'')+'"></td>':'')+Array.from({length:7},(_,i)=>'<td><input style="min-width:65px" class="wq" type="number" min="0" step="any" value="'+esc(x.daily?.[i]||'')+'" oninput="weeklyCalc()"></td>').join('')+'<td class="wt">0</td><td><button class="alt" onclick="this.closest(\'tr\').remove();weeklyCalc()">×</button></td>';$('#'+key).append(tr);weeklyCalc()}
function weeklyCalc(){let sum=0;for(let tr of document.querySelectorAll('#dm tr,#dt tr')){let n=[...tr.querySelectorAll('.wq')].reduce((a,x)=>a+(+x.value||0),0);tr.querySelector('.wt').textContent=n.toFixed(2);if(tr.parentElement.id==='dm')sum+=n}if($('#wh'))$('#wh').textContent=sum.toFixed(2)}
function weeklyRows(key){return [...document.querySelectorAll('#'+key+' tr')].map(tr=>{let name=tr.querySelector('.wn').value.trim(),daily=[...tr.querySelectorAll('.wq')].map(x=>{if(!x.validity.valid||+x.value<0)throw Error('Enter valid non-negative quantities');return +x.value||0}),qty=daily.reduce((a,b)=>a+b,0),unit=key==='dm'?'hours':tr.querySelector('.wu').value.trim();if(qty&&(!name||!unit))throw Error('Enter a name and unit for each used row');return {name,daily,qty,unit}}).filter(x=>x.name)}

let docketPhotos=[],photoBusy=false;
function photoEditor(){return '<h3>Photos</h3><p class="muted">Save draft to upload photos online. Up to 20 per docket.</p><div class="actions"><label class="tile" style="min-height:65px;cursor:pointer">📷 Take photo<input type="file" accept="image/*" capture="environment" onchange="addPhotos(this)" style="display:none"></label><label class="tile" style="min-height:65px;cursor:pointer">Upload photos<input type="file" accept="image/*" multiple onchange="addPhotos(this)" style="display:none"></label></div><div id="dphotos"></div>'}
function safePhoto(p){return typeof p?.src==='string'&&/^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(p.src)?p.src:''}
function renderPhotos(){if(!$('#dphotos'))return;$('#dphotos').innerHTML=docketPhotos.map((p,i)=>'<div class="day"><img style="width:100%;max-width:320px;border-radius:10px" src="'+safePhoto(p)+'" alt="Attached photo"><label>Description (optional)</label><input maxlength="500" value="'+esc(p.note||'')+'" oninput="docketPhotos['+i+'].note=this.value"><p class="muted">'+esc(p.at||'')+'</p><button class="alt" onclick="docketPhotos.splice('+i+',1);renderPhotos()">Remove photo</button></div>').join('')}
function photoView(ps){return '<h3>Photos</h3>'+((ps||[]).filter(safePhoto).map(p=>'<div class="day"><img style="width:100%;max-width:650px;background:white" src="'+safePhoto(p)+'" alt="Attached photo"><p>'+esc(p.note||'')+' · '+esc(p.at||'')+'</p><a download="site-photo.jpg" href="'+safePhoto(p)+'">Download photo</a></div>').join('')||'<p>No photos attached.</p>')}
async function addPhotos(input){if(photoBusy)return;photoBusy=true;let target=docketPhotos;try{for(let f of Array.from(input.files)){if(target.length>=20)throw Error('Maximum 20 photos per docket');if(f.size>30*1024*1024)throw Error('Photo is too large');let url=URL.createObjectURL(f);try{let img=new Image();img.src=url;await img.decode();let ratio=Math.min(1,1800/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*ratio));c.height=Math.max(1,Math.round(img.height*ratio));let ctx=c.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);let quality=.85,src=c.toDataURL('image/jpeg',quality);while(src.length>400000&&quality>.35){quality-=.1;src=c.toDataURL('image/jpeg',quality)}if(src.length>400000)throw Error('Photo is too detailed; crop or retake it');if(target!==docketPhotos||!$('#dphotos'))return;target.push({src,note:'',at:new Date().toLocaleString('en-AU',{timeZone:'Australia/Melbourne'})});renderPhotos()}finally{URL.revokeObjectURL(url)}}notify('Photos attached — save draft to keep them online')}catch(e){notify(e.message,true)}finally{photoBusy=false;input.value=''}}

let savingWeekly=false;
async function saveWeekly(submit){if(photoBusy)return notify('Wait for photos to finish loading',true);if(savingWeekly)return;savingWeekly=true;try{let w=$('#dw').value,job=$('#dj').value.trim(),data={job,machines:weeklyRows('dm'),materials:weeklyRows('dt'),notes:$('#dn').value,layout:'weekly',photos:docketPhotos};if(!w||weekOf(w)!==w||!job)throw Error('Select a Monday and enter a job');if(submit&&!data.photos.length&&![...data.machines,...data.materials].some(x=>x.qty>0))throw Error('Enter a quantity before submitting');let id=activeDocket?.id;if(id)await api('/records/'+id,{method:'PUT',body:JSON.stringify({data})});else{let r=await post('/records',{type:'docket',date:w,week:w,data});id=r.id;activeDocket={id}}if(submit)await post('/records/'+id+'/submit',{});await refresh();docket();notify(submit?'Docket submitted':'Draft saved online')}catch(e){notify(e.message,true)}finally{savingWeekly=false}}
function office(){if(me.role!=='manager')return go('home');let out='<section class="card hero"><h2>Office dashboard · V2</h2><p>Employee weekly folders and project records</p><button class="alt" onclick="pendingTimesheets()">Timesheets awaiting approval ('+records.filter(r=>r.type==='timesheet'&&r.status==='submitted').length+')</button></section><div class="actions"><button onclick="officeReset(\'people\')">Employees</button><button onclick="officeReset(\'jobs\')">Jobs</button><button onclick="officeReset(\'settings\')">Settings</button></div><section class="card">';if(officeMode==='settings'){out+='<h2>Management settings</h2><form id="newuser"><label>Name</label><input name="name" required><label>PIN</label><input type="password" name="pin" pattern="[0-9]{4}" required><label>Role</label><select name="role"><option value="employee">Employee</option><option value="manager">Manager</option></select><button>Add employee</button></form><hr><form id="newcat"><label>Type</label><select name="kind"><option>job</option><option>machine</option><option>material</option></select><label>Name</label><input name="name" required><label>Unit</label><input name="unit"><button>Add item</button></form>'}else if(officeMode==='jobs'){let jobs=[...new Set([...catalog.filter(c=>c.kind==='job').map(c=>c.name),...records.filter(r=>r.type==='docket').map(r=>r.data.job)])].sort();if(officeJob===null){out+='<h2>Jobs</h2>'+jobs.map((j,i)=>'<div class="line"><button class="alt" onclick="pickJob('+i+')">'+esc(j)+'</button></div>').join('');window.officeJobs=jobs}else{let rs=records.filter(r=>r.type==='docket'&&r.data.job===officeJob&&r.status!=='draft');out+='<button class="alt" onclick="officeReset(\'jobs\')">← Jobs</button><h2>'+esc(officeJob)+'</h2>'+summaryRows(rs)+rs.map(officeRecord).join('')}}else if(officeUser===null){out+='<h2>Employees</h2>'+users.map(u=>'<div class="line row"><b>'+esc(u.name)+'</b><button class="alt" onclick="pickEmployee('+u.id+')">Open →</button></div>').join('')}else{let rs=records.filter(r=>r.user_id===officeUser&&r.status!=='draft'),u=users.find(u=>u.id===officeUser);out+='<button class="alt" onclick="officeReset(\'people\')">← Employees</button><h2>'+esc(u?.name)+'</h2>';if(!officeFolder){out+='<div class="grid">'+[['timesheet','Timesheets','Weekly hours, signatures & payroll'],['docket','Dockets','Machine hours & materials'],['archive','Archived Timesheets','Actioned payroll records']].map(([type,label,desc])=>'<button class="tile" onclick="pickFolder(\''+type+'\')"><span>📁</span>'+label+'<small>'+desc+' · '+rs.filter(r=>folderMatch(r,type)).length+' records</small></button>').join('')+'</div>'}else{rs=rs.filter(r=>folderMatch(r,officeFolder));out+='<button class="alt" onclick="officeFolder=null;officeWeek=null;office()">← Employee folders</button><h3>'+(officeFolder==='timesheet'?'Timesheets':officeFolder==='archive'?'Archived Timesheets':'Dockets')+'</h3>';if(!officeWeek){let weeks=[...new Set([weekOf(today()),...rs.map(recWeek)])].sort().reverse();out+=weeks.map(w=>'<div class="line row"><b>📁 '+esc(weekLabel(w))+'</b><button class="alt" onclick="pickWeek(\''+w+'\')">Open ('+rs.filter(r=>recWeek(r)===w).length+')</button></div>').join('')}else{rs=rs.filter(r=>recWeek(r)===officeWeek);out+='<button class="alt" onclick="officeWeek=null;office()">← Weekly folders</button><h3>'+esc(weekLabel(officeWeek))+'</h3>'+summaryRows(rs)+(rs.map(officeRecord).join('')||'<p>No submissions for this week.</p>')}}}out+='</section><section class="card"><button onclick="payroll()">Weekly approved payroll CSV</button> <button class="alt" onclick="location.href=\'/api/export\'">All records CSV</button></section>';$('#screen').innerHTML=out;for(let [id,url] of [['newuser','/users'],['newcat','/catalog']])if($('#'+id))$('#'+id).onsubmit=async e=>{e.preventDefault();try{await post(url,Object.fromEntries(new FormData(e.target)));await refresh();office();notify('Saved')}catch(e){notify(e.message,true)}}}
function officeReset(mode){officeFolder=null;officeMode=mode;officeUser=null;officeWeek=null;officeJob=null;office()}
function pickFolder(type){officeFolder=type;officeWeek=null;office()}
function pickEmployee(id){officeFolder=null;officeUser=id;officeWeek=null;office()}
function pickWeek(w){officeWeek=w;office()}
function pickJob(i){officeJob=window.officeJobs[i];office()}
function summaryRows(rs){let labour=0,plant=0,materials={};for(let r of rs){if(r.type==='timesheet')labour+=(r.data.days||[]).reduce((a,d)=>a+hours(d),0);else{plant+=(r.data.machines||[]).reduce((a,d)=>a+Number(d.qty||0),0);for(let x of r.data.materials||[]){let k=x.name+' · '+x.unit;materials[k]=(materials[k]||0)+Number(x.qty||0)}}}return '<p>Labour: '+labour.toFixed(2)+' hrs · Plant: '+plant.toFixed(2)+' hrs</p>'+Object.entries(materials).map(([k,v])=>'<p>'+esc(k)+': '+v.toFixed(2)+'</p>').join('')}

function adminTimesheet(id){if(me.role!=='manager')return;let r=records.find(x=>x.id===id&&x.type==='timesheet');if(!r)return;$('#screen').innerHTML='<section class="card"><button class="alt" onclick="office()">← Office</button><h2>Correct timesheet · '+esc(r.employee)+'</h2><p>Original signed submission is retained in the change history. Corrections require approval again.</p><label>Week commencing Monday</label><input id="week" type="date" value="'+esc(recWeek(r))+'"><div id="days"></div><div class="row"><b>Weekly total</b><span class="number" id="total"></span></div><label>Reason for correction (required)</label><textarea id="adminreason" maxlength="1000"></textarea><div class="actions"><button onclick="saveAdminTimesheet('+id+')">Save corrections</button></div></section>';buildDays();document.querySelectorAll('[data-day]').forEach((el,i)=>{let d=r.data.days[i];for(let k of ['kind','start','finish','break'])el.querySelector('.'+k).value=d[k]??'';el.querySelector('.desc').value=d.description||''});calc()}
async function saveAdminTimesheet(id){try{let week=$('#week').value,note=$('#adminreason').value.trim();if(!note)throw Error('Enter a reason for the correction');await api('/records/'+id+'/admin-timesheet',{method:'PUT',body:JSON.stringify({week,note,days:daysData()})});await refresh();office();notify('Corrections saved — awaiting approval')}catch(e){notify(e.message,true)}}
function pendingTimesheets(){if(me.role!=='manager')return;$('#screen').innerHTML='<section class="card"><button class="alt" onclick="office()">← Office</button><h2>Timesheets awaiting approval</h2>'+(records.filter(r=>r.type==='timesheet'&&r.status==='submitted').map(officeRecord).join('')||'<p>All caught up.</p>')+'</section>'}


function folderMatch(r,type){return type==='archive'?r.type==='timesheet'&&!!r.data.archivedAt:type===r.type&&!r.data.archivedAt}
async function archiveTimesheet(id,restore=false){if(!confirm(restore?'Restore this timesheet to active records?':'Confirm payroll has been actioned and archive this timesheet?'))return;try{await post('/records/'+id+'/archive',{restore});await refresh();office();notify(restore?'Timesheet restored':'Timesheet actioned and archived')}catch(e){notify(e.message,true)}}

function officeRecord(r){return '<div class="line"><div class="row"><b>'+esc(r.employee)+' · '+esc(r.type==='timesheet'?'Timesheet':r.data.job)+' #'+r.id+'</b><span class="pill">'+esc(r.data.archivedAt?'archived':r.status)+'</span></div><p>'+esc(r.date)+'</p><div class="actions"><button class="alt" onclick="viewRecord('+r.id+')">View</button>'+(r.type==='timesheet'&&!r.data.archivedAt&&['submitted','approved','returned'].includes(r.status)?'<button class="alt" onclick="adminTimesheet('+r.id+')">Edit timesheet</button>':'')+(r.type==='timesheet'&&r.status==='approved'?(r.data.archivedAt?'<button class="alt" onclick="archiveTimesheet('+r.id+',true)">Restore</button>':'<button onclick="archiveTimesheet('+r.id+')">Actioned &amp; archive</button>'):'')+(r.status==='submitted'?'<button onclick="review('+r.id+',\'approved\')">Approve</button><button class="danger" onclick="review('+r.id+',\'returned\')">Return</button>':'')+'</div></div>'}
function payroll(){let w=prompt('Week commencing Monday (YYYY-MM-DD)',officeWeek||weekOf(today()));if(!w||weekOf(w)!==w)return;let q=x=>'"'+String(x??'').replace(/^[=+@-]/,"'(async()=>{try{me=await api('/me');").replaceAll('"','""')+'"';let rows=[['Employee','Week','Record','Hours'],...records.filter(r=>r.type==='timesheet'&&r.status==='approved'&&!r.data.archivedAt&&recWeek(r)===w).map(r=>[r.employee,w,r.id,r.data.days.reduce((a,d)=>a+hours(d),0).toFixed(2)])];let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows.map(r=>r.map(q).join(',')).join('\r\n')],{type:'text/csv'}));a.download='SWE-payroll-'+w+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

(async()=>{try{me=await api('/me');await start()}catch{login()}})();if('serviceWorker'in navigator)navigator.serviceWorker.register('/service-worker.js').catch(()=>{});
</script></body></html>
