<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f7fb"><link rel="manifest" href="/manifest.webmanifest"><title>SWE Crew</title><style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#edf6ff;background:#071326}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{border:0;border-radius:13px;background:#137cf5;color:white;font-weight:750;padding:13px 17px;cursor:pointer}button.alt{background:#183353}button.danger{background:#8c3041}button:disabled{opacity:.4}input,select,textarea{background:#0d2139;color:#fff;border:1px solid #35516e;border-radius:11px;padding:12px;width:100%;min-height:44px}textarea{min-height:88px;resize:vertical}label{display:block;color:#a9c6e8;font-size:12px;font-weight:750;margin:10px 0 5px}.app{max-width:1040px;margin:auto;padding:16px 16px 94px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0 16px}.brand{display:flex;align-items:center;gap:10px}.brand img{height:58px;width:58px;object-fit:cover;border-radius:14px}.eyebrow{color:#59b5ff;letter-spacing:.1em;font-size:11px;font-weight:800}h1{font-size:25px;margin:3px 0}h2{font-size:19px;margin:0 0 12px}h3{margin:10px 0}p{color:#a9c6e8}.card{background:linear-gradient(145deg,#142b49,#0d1f36);border:1px solid #28466b;border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 8px 24px #0002}.hero{background:linear-gradient(120deg,#075fd7,#14a4ff);border:0}.hero p{color:#e4f4ff}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.tile{padding:20px;text-align:left;min-height:125px;background:#183a63;border-radius:18px;display:flex;flex-direction:column;justify-content:space-between}.tile span{font-size:26px}.tile small{color:#b9d9ff}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.stack{display:grid;gap:10px}.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.pill{font-size:11px;background:#164f85;color:#bde1ff;padding:6px 10px;border-radius:30px;font-weight:700}.nav{position:fixed;bottom:0;left:0;right:0;background:#08182d;border-top:1px solid #2b496c;display:flex;justify-content:center;padding:8px 6px max(8px,env(safe-area-inset-bottom));z-index:5}.nav button{background:transparent;color:#9db6d5;flex:1;max-width:220px;padding:8px 3px;font-size:11px}.nav button.active{color:#4eaaff}.nav b{display:block;font-size:21px}.day{padding:14px;background:#0a1d34;border:1px solid #244363;border-radius:15px;margin:10px 0}.muted{color:#9fb7d4;font-size:12px}.line{border-bottom:1px solid #2b486a;padding:12px 0}.hidden{display:none!important}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.actions button{flex:1}.signature{width:100%;height:130px;touch-action:none;background:#f6fbff;border-radius:12px;border:2px dashed #58a8ff}.number{font-size:27px;font-weight:850;color:#65bdff}.notice{padding:12px;border-radius:12px;background:#123d60;color:#c9e9ff;margin:10px 0}.bad{background:#5e2637}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:10px;text-align:left;border-bottom:1px solid #2b486a}a{color:#6cbcff}@media(min-width:720px){.grid{grid-template-columns:repeat(4,1fr)}.fields{grid-template-columns:repeat(4,1fr)}.app{padding:24px 24px 100px}}

</style></head><body><main class="app"><header class="top"><div class="brand"><img src="/logo.jpg" alt="South West Earthworks logo"><div><div class="eyebrow">SOUTH WEST EARTHWORKS</div><h1>CREW HUB</h1></div></div><div class="header-actions"><details id="logout" style="display:none;position:relative"><summary class="alt account-identity" style="cursor:pointer;padding:8px"><span class="account-avatar" aria-hidden="true">♙</span><span class="account-person"><strong id="headerUserName">My Account</strong><small id="headerUserRole">Crew Member</small></span><span class="account-chevron" aria-hidden="true">⌄</span></summary><div class="card account-dropdown"><button class="alt" onclick="accountPage()">⚙ <span>Account details / PIN</span></button><button class="alt" onclick="personalDetails()">♙ <span>My personal information</span></button><button class="alt" id="themeToggle" onclick="toggleTheme()" aria-label="Switch appearance">☾ Dark</button><div class="account-menu-divider"></div><button class="alt account-signout" onclick="logout()">⇥ <span>Sign out</span></button></div></details></div></header><div id="screen"></div></main><nav class="nav hidden" id="nav"><button onclick="go('home')" id="n-home"> <b>⌂</b>Home</button><button onclick="go('timesheet')" id="n-timesheet"><b>◷</b>Timesheet</button><button onclick="go('docket')" id="n-docket"><b>▤</b>Plant & Materials</button><button onclick="go('history')" id="n-history"><b>◴</b>History</button><button onclick="go('office')" id="n-office" class="hidden"><b>▦</b>Office</button></nav><script>

function applyTheme(mode){document.documentElement.dataset.theme=mode;document.querySelector('meta[name="theme-color"]').content=mode==='dark'?'#071326':'#f4f7fb';document.getElementById('themeToggle').textContent=mode==='dark'?'☀ Light mode':'☾ Dark mode';try{localStorage.setItem('swe-theme',mode)}catch{}}
function toggleTheme(){applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark')}
let savedTheme='light';try{if(localStorage.getItem('swe-theme')==='dark')savedTheme='dark'}catch{}applyTheme(savedTheme);

let me=null,records=[],catalog=[],users=[],page='home',signature='',editing=null;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=async(url,opts={})=>{const r=await fetch('/api'+url,{headers:{'Content-Type':'application/json'},...opts});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d};
const post=(url,data)=>api(url,{method:'POST',body:JSON.stringify(data)});
const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Australia/Melbourne'});
const monday=()=>{let d=new Date(),dow=(d.getDay()+6)%7;d.setDate(d.getDate()-dow);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const shiftHours=d=>{
  if(d.kind!=='work'||!d.start||!d.finish)return 0;
  const [startHour,startMinute]=d.start.split(':').map(Number);
  const [finishHour,finishMinute]=d.finish.split(':').map(Number);
  return ((finishHour-startHour)*60+finishMinute-startMinute)/60;
};
const hours=d=>d.kind==='work'&&d.start&&d.finish?Math.max(0,shiftHours(d)-(+d.break||0)):0;
const select=(kind,extra='')=>`<select ${extra}>${catalog.filter(c=>c.kind===kind).map(c=>`<option value="${esc(c.name)}">${esc(c.name)}</option>`).join('')}</select>`;
async function refresh(){records=await api('/records');catalog=await api('/catalog');if(me.role==='manager')users=await api('/users')}
function notify(s,error=false){let n=document.createElement('div');n.className='notice'+(error?' bad':'');n.textContent=s;$('#screen').prepend(n);setTimeout(()=>n.remove(),4500)}
function saveFeedback(message,error=false){let old=document.getElementById('saveFeedback');if(old)old.remove();let n=document.createElement('div');n.id='saveFeedback';n.setAttribute('role','status');n.style.cssText='position:fixed;bottom:calc(78px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100vw - 28px);padding:13px 20px;background:'+(error?'#a92727':'#11643c')+';color:white;font-weight:700;font-size:15px;text-align:center;z-index:10050;border-radius:4px;box-shadow:0 5px 24px #0005';n.textContent=message;document.body.appendChild(n);setTimeout(()=>{if(n.isConnected)n.remove()},4200)}




let plantList=[],plantChecks=[],plantServices=[];

function serviceTargets(e){let a=[];if(e.next_hours!=null)a.push(e.next_hours+' hrs ('+(e.next_hours-e.current_hours)+' remaining)');if(e.next_kms!=null)a.push(e.next_kms+' km'+(e.current_kms!=null?' ('+(e.next_kms-e.current_kms)+' remaining)':''));if(e.next_date)a.push(esc(e.next_date));return a.length?'Next service: '+a.join(' · '):'No service target set'}
function editTargets(id){let e=plantList.find(x=>x.id===id);$('#screen').innerHTML='<section class="card"><h2>Edit next service</h2><form id="targetsform"><label>Next service hours</label><input type="number" min="0" step="0.1" name="next_hours"><label>Next service kilometres</label><input type="number" min="0" step="1" name="next_kms"><label>Next service date</label><input type="date" name="next_date"><button>Save</button></form></section>';let f=$('#targetsform');for(let k of ['next_hours','next_kms','next_date'])f.elements[k].value=e[k]??'';f.onsubmit=async ev=>{ev.preventDefault();try{await api('/equipment/'+id+'/targets',{method:'PUT',body:JSON.stringify(Object.fromEntries(new FormData(f)))});await plantPage()}catch(err){notify(err.message,true)}}}
async function serviceTracker(){if(me.role!=='manager')return;try{plantList=await api('/equipment');plantServices=await api('/plant-services');plantChecks=await api('/prestarts');$('#screen').innerHTML='<section class="card hero"><h2>Machinery Service Tracker</h2></section><section class="card"><button class="alt" onclick="plantPage()">Equipment register</button>'+plantList.map(e=>'<div class="line"><h3>'+esc(e.name)+'</h3><p>'+serviceTargets(e)+'</p><button onclick="editTargets('+e.id+')">Edit next service</button><button class="alt" onclick="servicePlant('+e.id+')">Record service</button><button class="alt" onclick="openPlant('+e.id+')">History</button></div>').join('')+'</section>'}catch(e){notify(e.message,true)}}

let fleetCatalog=[];
function quickMachineRate(name,rates){let r=rates.find(x=>x.kind==='machine'&&x.unit==='hours'&&x.name===name.trim().toLowerCase());return '<form class="quickmachinerate" style="margin:8px 0"><input type="hidden" name="name" value="'+esc(name)+'"><label>Internal cost ($/hr ex GST)</label><div class="row"><input name="rate" type="number" min="0" step=".01" required placeholder="Not set" value="'+(r?.rate??'')+'"><button type="submit" class="alt">Save rate</button></div></form>'}
async function plantPage(){try{plantList=await api('/equipment');plantChecks=await api('/prestarts');let manager=me.role==='manager',rates=[];if(manager){rates=(await api('/costing')).rates;plantServices=await api('/plant-services');fleetCatalog=(await api('/catalog/manage')).filter(c=>c.kind==='machine')}$('#screen').innerHTML='<section class="card hero"><h2>'+(manager?'Manage Equipment':'Daily pre-starts')+'</h2><p>'+(manager?'Fleet profiles, servicing, inspections and docket equipment':'Select a machine')+'</p></section><section class="card">'+(manager?'<div class="actions"><button onclick="addPlant()">+ Add equipment</button><button class="alt" onclick="serviceTracker()">Service tracker</button></div>':'')+plantList.map(e=>'<div class="line"><b>'+esc(e.name)+'</b><p>'+esc(e.category)+' · '+e.current_hours+' hrs'+(e.current_kms!=null?' · '+e.current_kms+' km':'')+'</p>'+(manager?'<p>'+serviceTargets(e)+'</p><p>Docket list: '+(fleetCatalog.some(c=>c.name===e.name&&c.active)?'Active':'Not active')+'</p>':'')+'<button class="alt" onclick="openPlant('+e.id+')">Open profile</button></div>').join('')+(plantList.length?'':'<p>No equipment added yet.</p>')+'</section>'+(manager?'<section class="card"><h2>Docket equipment list</h2><form id="fleetadd"><label>Machine name</label><input name="name" required><button>Add docket item</button></form>'+fleetCatalog.map(c=>'<div class="line"><b>'+esc(c.name)+'</b><button class="alt" onclick="editFleetItem('+c.id+')">Edit</button><button class="danger" onclick="deleteFleetItem('+c.id+')">Delete</button>'+quickMachineRate(c.name,rates)+'</div>').join('')+'</section>':'');if(manager)document.querySelectorAll('.quickmachinerate').forEach(f=>f.onsubmit=async ev=>{ev.preventDefault();let d=Object.fromEntries(new FormData(f));try{await post('/costing/rate',{kind:'machine',name:d.name,unit:'hours',rate:d.rate});notify('Hourly cost saved');await plantPage()}catch(e){notify(e.message,true)}});if(manager)$('#fleetadd').onsubmit=async ev=>{ev.preventDefault();try{await post('/catalog',{kind:'machine',name:new FormData(ev.target).get('name'),unit:'hours'});await refresh();await plantPage()}catch(e){notify(e.message,true)}}}catch(e){notify(e.message,true)}}
async function deleteFleetItem(id){let c=fleetCatalog.find(x=>x.id===id);if(!c||!confirm('Delete '+c.name+' from the docket equipment list? Existing saved dockets will not be deleted.'))return;try{await api('/catalog/'+id,{method:'DELETE'});await refresh();await plantPage()}catch(e){notify(e.message,true)}}
function editFleetItem(id){let c=fleetCatalog.find(x=>x.id===id);if(!c)return;$('#screen').innerHTML='<section class="card"><h2>Edit docket equipment</h2><form id="fleetedit"><label>Name</label><input name="name" required><label>Unit</label><input name="unit"><button>Save</button><button type="button" class="alt" onclick="plantPage()">Cancel</button></form></section>';let f=$('#fleetedit');f.elements.name.value=c.name;f.elements.unit.value=c.unit||'';f.onsubmit=async ev=>{ev.preventDefault();try{await api('/catalog/'+id,{method:'PUT',body:JSON.stringify({...Object.fromEntries(new FormData(f)),active:!!c.active})});await refresh();await plantPage()}catch(e){notify(e.message,true)}}}

async function prestartPhoto(file){if(file.size>30*1024*1024)throw Error('Photo too large');let url=URL.createObjectURL(file);try{let im=new Image();im.src=url;await im.decode();let c=document.createElement('canvas'),ratio=Math.min(1,1400/Math.max(im.width,im.height));c.width=Math.max(1,Math.round(im.width*ratio));c.height=Math.max(1,Math.round(im.height*ratio));c.getContext('2d').drawImage(im,0,0,c.width,c.height);for(let q=.85;q>=.25;q-=.1){let src=c.toDataURL('image/jpeg',q);if(src.length<=400000)return src}throw Error('Retake photo at lower resolution')}finally{URL.revokeObjectURL(url)}}

function jobQuantitySummary(lines,submittedOnly=true){
  const groups=new Map();
  for(const {kind,name,unit,qty,status} of lines){
    if(!['machine','material'].includes(kind)||(submittedOnly&&!['submitted','approved'].includes(status)))continue;
    const label=name.trim();
    const key=JSON.stringify([kind,label.toLowerCase(),unit]);
    if(!groups.has(key))groups.set(key,{kind,name:label,unit,qty:0});
    groups.get(key).qty+=qty;
  }
  return [...groups.values()].sort((a,b)=>a.name.localeCompare(b.name,'en-AU'));
}

function jobCostTotals(lines,kind,quantities=[]){
  const items=new Map();
  function getItem(name){
    const label=name.trim();
    const key=label.toLowerCase();
    if(!items.has(key))items.set(key,{name:label,quantities:[],amount:0,missing:false,priced:false});
    return items.get(key);
  }
  for(const quantity of quantities){
    getItem(quantity.name).quantities.push(quantity.qty.toLocaleString('en-AU',{maximumFractionDigits:4})+' '+quantity.unit);
  }
  for(const line of lines.filter(line=>line.kind===kind)){
    const item=getItem(line.name);
    item.amount+=line.amount??0;
    item.missing||=line.amount===null;
    item.priced||=line.amount!==null;
  }
  return [...items.values()].sort((a,b)=>a.name.localeCompare(b.name,'en-AU'));
}

function jobTotalsTable(title,items,quantityLabel){
  const amount=items.reduce((sum,item)=>sum+item.amount,0);
  const costLabel=items.some(item=>item.missing)?'Recorded total (incomplete)':'Total';
  return `<h4>${title}</h4>`+(items.length?`<table style="width:100%;text-align:left">
    <thead><tr><th scope="col">Item</th>${quantityLabel?`<th scope="col">${quantityLabel}</th>`:''}<th scope="col">Amount ex GST</th></tr></thead>
    <tbody>${items.map(item=>`<tr><td>${esc(item.name)}${item.status?`<br><small>${esc(item.status)}</small>`:''}</td>
      ${quantityLabel?`<td>${esc(item.quantities.join(' + ')||'—')}</td>`:''}
      <td>${item.priced?costMoney(item.amount):'—'}${item.missing?` <small>${esc(item.issue||'Incomplete')}</small>`:''}</td></tr>`).join('')}</tbody>
    <tfoot><tr><th scope="row" colspan="${quantityLabel?2:1}">${costLabel}</th><td><strong>${costMoney(amount)}</strong></td></tr></tfoot>
  </table>`:'<p>None recorded.</p>');
}

function jobDailyCostTables(days){
  return Object.keys(days).sort().reverse().map(day=>{
    const items=days[day].map(line=>({
      name:line.name,
      quantities:line.qty?[line.qty.toLocaleString('en-AU',{maximumFractionDigits:4})+' '+line.unit]:[],
      amount:line.amount??0,
      missing:line.amount===null,
      priced:line.amount!==null,
      issue:line.issue||'Missing rate',
      status:line.status
    }));
    return `<div class="line">${jobTotalsTable(esc(day),items,'Quantity')}</div>`;
  }).join('')||'<p>No daily amounts recorded.</p>';
}

function jobProjectTotals(lines,machineHours,materials,startDay){
  const machines=jobQuantitySummary(machineHours,false).filter(item=>item.unit==='hours');
  const totalHours=machines.reduce((sum,item)=>sum+item.qty,0);
  return `<h3>Project totals for Xero</h3>
    <p class="muted">Quantities include all saved dockets. Dollar amounts use the costing period from ${esc(startDay)}.</p>
    <p><strong>Total machine hours on project: ${totalHours.toLocaleString('en-AU',{maximumFractionDigits:4})} hrs</strong></p>`+
    jobTotalsTable('Machine hours and amounts',jobCostTotals(lines,'machine',machines),'Total hours')+
    jobTotalsTable('Crushed rock and other materials',jobCostTotals(lines,'material',materials),'Project quantity')+
    jobTotalsTable('Other expenses',jobCostTotals(lines,'extra'));
}

function jobMarginSummary(job,total){
  const current=job.budget>0?((job.budget-total)/job.budget*100).toFixed(1)+'%':'Unavailable';
  return `<div class="grid">
    <div class="card"><small>Target margin</small><div class="number">${job.margin}%</div></div>
    <div class="card"><small>Margin based on recorded amounts</small><div class="number">${current}</div></div>
  </div>`+(job.budget>0
    ?'<p class="muted">Calculated as (contract value − recorded amounts to date) ÷ contract value. This figure uses docket rates and recorded expenses. Actual profit requires actual costs.</p>'
    :'<p class="muted">A contract value is needed to calculate this percentage.</p>');
}

    const status=await api('/xero/status');
    if(!panel.isConnected)return;
    if(!status.configured){
      panel.textContent='Xero credentials are not configured on the Crew Hub service.';
      return;
    }
    const connect='<button class="alt" onclick="startXeroConnection()">Connect Xero</button>';
    if(!status.connected){
      panel.innerHTML=connect;
      return;
    }
    panel.innerHTML=connect;
    const organisations=await api('/xero/organisations');
    if(!panel.isConnected)return;
    const selected=organisations.find(org=>org.id===status.tenant);
    if(selected){
      await renderXeroDraftReview(panel,jobId,selected,showAmounts);
      return;
    }
    panel.innerHTML='<label for="xero-organisation">Xero organisation</label><select id="xero-organisation"><option value="">Select your organisation</option>'+
      organisations.map(org=>'<option value="'+esc(org.id)+'">'+esc(org.name)+'</option>').join('')+'</select>';
    const orgSelect=$('#xero-organisation');
    orgSelect.onchange=async()=>{
      $('#xero-draft-form-area')?.remove();
      if(!orgSelect.value)return;
      orgSelect.disabled=true;
      try{
        const org=await post('/xero/organisation',{id:orgSelect.value});
        if(panel.isConnected)await renderXeroDraftReview(panel,jobId,org,showAmounts);
      }catch(error){notify(error.message,true)}
      finally{orgSelect.disabled=false}
    };
    panel.insertAdjacentHTML('beforeend',connect);
  }catch(error){notify(error.message,true)}
}

async function renderXeroDraftReview(panel,jobId,organisation,showAmounts){

    const draft=await post('/xero/job/'+jobId+'/preview',values);
    if(!review.isConnected)return;
    review.innerHTML='<p><b>'+esc(organisation.name)+'</b> · '+esc(draft.reference)+'</p>'+
      '<p>Choose the customer in Xero.</p>'+
      (draft.previous?'<p>The previous draft covered work through '+esc(draft.previous)+'. This draft uses later entries.</p>':'')+
      xeroDraftPreviewTable(draft,showAmounts)+
      (draft.excluded?'<p>'+draft.excluded+' draft or returned costing entries excluded.</p>':'')+
      '<button id="xero-create-draft">Create draft in Xero</button>';

      const button=event.currentTarget;
      button.disabled=true;

        const saved=await post('/xero/job/'+jobId+'/draft',{...values,proof:draft.proof});
        const link=document.createElement('a');
        link.href='https://go.xero.com/AccountsReceivable/View.aspx?InvoiceID='+encodeURIComponent(saved.invoiceId);

    };
  }catch(error){if(review.isConnected)review.textContent=error.message}
}

async function enableMorningPush(silent=false){try{if(!('serviceWorker'in navigator)||!('PushManager'in window)||!('Notification'in window))throw Error('Notifications unavailable. On iPhone install Crew Hub to your Home Screen first.');if(await Notification.requestPermission()!=='granted')throw Error('Allow notifications in your phone settings');let reg=await navigator.serviceWorker.ready,k=(await api('/push-key')).key;let bytes=Uint8Array.from(atob(k.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-k.length%4)%4)),c=>c.charCodeAt(0));let sub=await reg.pushManager.getSubscription()||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:bytes});await post('/push-subscribe',sub.toJSON());if(!silent)notify('Morning reminders enabled on this phone');return true}catch(e){if(!silent)notify(e.message,true);return false}}

let autoDraft=null,autoBusy=false;
function draftSnapshot(type){if(type==='timesheet'){let w=$('#week').value;return {w,data:{days:daysData(),signature:signature?$('#sig').toDataURL('image/png'):''}}}let w=$('#dw').value;return {w,data:{job:$('#dj').value.trim(),job_catalog_id:Number($('#djselect')?.value)||null,description:$('#dworks').value.trim(),machines:machineGridData(),materials:[...legacyMaterials,...cartageMaterials(w)],loads:structuredClone(cartageLoads),notes:$('#dn').value,layout:'weekly',photos:docketPhotos}}}

async function draftSave(type,submit,automatic){let state=autoDraft;if(!state||state.type!==type||!state.el.isConnected||state.user!==me?.id)return;if(autoBusy||photoBusy&&type==='docket'){if(!automatic)saveFeedback('Saving in progress — try again shortly',true);return}autoBusy=true;try{let {w,data}=draftSnapshot(type),snapshot=JSON.stringify({w,data});if(automatic&&snapshot===state.last)return;if(!w||weekOf(w)!==w||type==='docket'&&!data.job)throw Error('Enter a job and valid Monday to save');if(type==='timesheet'&&submit&&!data.signature)throw Error('Please sign your timesheet first');if(type==='docket'&&submit)cartageMaterials(w,true);if(type==='docket'&&submit&&!data.photos.length&&![...data.machines,...data.materials].some(x=>x.qty>0))throw Error('Enter a quantity before submitting');let id=type==='timesheet'?editing:activeDocket?.id;state.tag.textContent='Saving…';if(id)await api('/records/'+id,{method:'PUT',body:JSON.stringify({data,...(type==='docket'?{week:w}:{})})});else{id=(await post('/records',{type,date:w,week:w,data})).id}if(state!==autoDraft||!state.el.isConnected){await refresh();return}if(type==='timesheet')editing=id;else activeDocket={id};state.el.disabled=true;state.last=snapshot;state.tag.textContent='Draft saved online · '+new Date().toLocaleTimeString('en-AU',{hour12:true});if(submit){await post('/records/'+id+'/submit',{});autoDraft=null;await refresh();type==='timesheet'?go('history'):docket();notify('Submitted to office')}else{await refresh();if(!automatic)saveFeedback('✓ Draft saved successfully')}}catch(e){if(state.el.isConnected)state.tag.textContent='Not saved — '+e.message;if(!automatic)saveFeedback('Not saved — '+e.message,true)}finally{autoBusy=false}}
setInterval(()=>{if(autoDraft?.el.isConnected&&me?.id===autoDraft.user)draftSave(autoDraft.type,false,true)},3000);

function timesheetDayView(day,week,index){

function docketQuantityTable(title,items){
  const totals=new Map();
  for(const item of items)totals.set(item.unit,(totals.get(item.unit)||0)+item.qty);
  const format=qty=>qty.toLocaleString('en-AU',{maximumFractionDigits:4});
  return `<h4>${esc(title)}</h4>`+(items.length?`<div class="tablewrap"><table style="width:100%;text-align:left">
    <thead><tr><th scope="col">Item</th><th scope="col">Quantity</th></tr></thead>
    <tbody>${items.map(item=>`<tr><td>${esc(item.name)}</td><td>${format(item.qty)} ${esc(item.unit)}</td></tr>`).join('')}</tbody>
    <tfoot>${[...totals].map(([unit,qty])=>`<tr><th scope="row">Total</th><td><strong>${format(qty)} ${esc(unit)}</strong></td></tr>`).join('')}</tfoot>
  </table></div>`:'<p>None recorded.</p>');
}

function docketQuantityLines(record){
  const d=record.data;
  const lines=[];
  const loads=(d.loads||[]).filter(load=>load.material?.trim()&&Number(load.tonnes)>0);
  const materials=(d.materials||[]).filter(item=>!loads.length||!item.fromCartage);
  for(const [kind,items] of [['machine',d.machines||[]],['material',materials]]){
    for(const item of items){
      const rawUnit=String(item.unit||'').trim();
      const unit=kind==='machine'?'hrs':/^(t|tons?|tonnes?)$/i.test(rawUnit)?'tonnes':rawUnit;
      const hasDaily=Array.isArray(item.daily)&&item.daily.length;
      const quantities=hasDaily?item.daily.slice(0,7):[item.qty];
      quantities.forEach((qty,index)=>{
        if(!item.name?.trim()||!Number.isFinite(Number(qty))||Number(qty)<=0)return;
        const day=new Date((hasDaily?recWeek(record):record.date)+'T12:00:00Z');
        day.setUTCDate(day.getUTCDate()+index);
        lines.push({kind,name:item.name,unit,qty:Number(qty),day:Number.isFinite(+day)?day.toISOString().slice(0,10):''});
      });
    }
  }
  for(const load of loads)lines.push({kind:'material',name:load.material,unit:'tonnes',qty:Number(load.tonnes),day:load.date||''});
  return lines;
}

function dailyQuantityTables(lines){
  const days=new Map();
  for(const line of lines){
    if(!days.has(line.day))days.set(line.day,[]);
    days.get(line.day).push(line);
  }
  return [...days].sort(([a],[b])=>b.localeCompare(a)).map(([day,items])=>
    docketQuantityTable(day||'Date unavailable',jobQuantitySummary(items,false))).join('')||'<p>No daily quantities recorded.</p>';
}

function projectQuantityTables(lines){
  const totals=jobQuantitySummary(lines,false);
  return docketQuantityTable('Machine hours and labour',totals.filter(item=>item.kind==='machine'))+
    docketQuantityTable('Crushed rock and other materials',totals.filter(item=>item.kind==='material'));
}

function docketRecordView(record){
  const d=record.data;
  const lines=docketQuantityLines(record);
  return `<p><b>Project</b> ${esc(d.job)} · Week commencing ${esc(recWeek(record))}</p>
    <h3>Description of works</h3><div style="white-space:pre-wrap">${esc(d.description||'Not recorded')}</div>

    ${cartageView(d.loads)}${photoView(d.photos)}`;
}

async function addLoadPhoto(i,input){if(photoBusy)return;let f=input.files?.[0],target=cartageLoads[i],list=cartageLoads;if(!f||!target)return;photoBusy=true;let url;try{if(f.size>30*1024*1024)throw Error('Photo too large');url=URL.createObjectURL(f);let img=new Image();img.src=url;await img.decode();let ratio=Math.min(1,1800/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*ratio));c.height=Math.max(1,Math.round(img.height*ratio));let ctx=c.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);let q=.85,src=c.toDataURL('image/jpeg',q);while(src.length>400000&&q>.35){q-=.1;src=c.toDataURL('image/jpeg',q)}if(src.length>400000)throw Error('Crop or retake photo');if(list!==cartageLoads||!list.includes(target)||!$('#cartage'))return;let total=list.reduce((n,l)=>n+(l===target?src.length:l.photo?.src?.length||0),0)+docketPhotos.reduce((n,p)=>n+p.src.length,0);if(total>8500000)throw Error('Docket photo limit reached; split loads into another docket');target.photo={src,at:new Date().toISOString()};renderCartage()}catch(e){notify(e.message,true)}finally{if(url)URL.revokeObjectURL(url);photoBusy=false;input.value=''}}

function summaryRows(rs){let labour=0,plant=0,materials={};for(let r of rs){if(r.type==='timesheet')labour+=(r.data.days||[]).reduce((a,d)=>a+hours(d),0);else{plant+=(r.data.machines||[]).reduce((a,d)=>a+Number(d.qty||0),0);for(let x of r.data.materials||[]){let k=x.name+' · '+x.unit;materials[k]=(materials[k]||0)+Number(x.qty||0)}}}return '<p>Labour: '+labour.toFixed(2)+' hrs · Plant: '+plant.toFixed(2)+' hrs</p>'+Object.entries(materials).map(([k,v])=>'<p>'+esc(k)+': '+v.toFixed(2)+'</p>').join('')}

function adminTimesheet(id){if(me.role!=='manager')return;let r=records.find(x=>x.id===id&&x.type==='timesheet');if(!r)return;$('#screen').innerHTML='<section class="card"><button class="alt" onclick="go(\''+(page==='approvals'?'approvals':'office')+'\')">← Back</button><h2>Correct timesheet · '+esc(r.employee)+'</h2><p>Original signed submission is retained in the change history. Corrections require approval again.</p><label>Week commencing Monday</label><input id="week" type="date" value="'+esc(recWeek(r))+'"><div id="days"></div><div class="row"><b>Weekly total</b><span class="number" id="total"></span></div><label>Reason for correction (required)</label><textarea id="adminreason" maxlength="1000"></textarea><div class="actions"><button onclick="saveAdminTimesheet('+id+')">Save corrections</button></div></section>';buildDays();document.querySelectorAll('[data-day]').forEach((el,i)=>{let d=r.data.days[i];for(let k of ['kind','start','finish','break'])el.querySelector('.'+k).value=d[k]??'';restoreClock(el,'start');restoreClock(el,'finish');el.querySelector('.desc').value=d.description||''});calc()}
async function saveAdminTimesheet(id){try{let week=$('#week').value,note=$('#adminreason').value.trim();if(!note)throw Error('Enter a reason for the correction');await api('/records/'+id+'/admin-timesheet',{method:'PUT',body:JSON.stringify({week,note,days:daysData()})});await refresh();if(page==='approvals')pendingTimesheets(false);else office();notify('Corrections saved — awaiting approval')}catch(e){notify(e.message,true)}}
async function pendingTimesheets(loadLatest=true){
  if(me.role!=='manager')return;
  $('#screen').innerHTML=`<section class="card">
    <button class="alt" onclick="go('home')">← Dashboard</button>
    <h2>Timesheets awaiting approval</h2>
    <fieldset id="approval-actions" style="min-width:0;border:0;padding:0;margin:0">
      <button class="alt" onclick="pendingTimesheets()">Refresh</button>
      <div id="pending-timesheets"></div>
    </fieldset>
  </section>`;
  const list=$('#pending-timesheets');
  if(loadLatest){
    list.textContent='Checking for submitted timesheets…';
    try{
      const latest=await api('/records');
      if(!list.isConnected)return;
      records=latest;
    }catch(e){
      if(list.isConnected)list.textContent='Could not load timesheets. Select Refresh to try again.';
      return;
    }
  }
  const pending=records.filter(r=>r.type==='timesheet'&&r.status==='submitted');
  if(!pending.length){
    list.innerHTML='<p>All caught up.</p>';
    return;
  }
  list.innerHTML=`<div class="actions">
    <label class="approval-checkbox"><input type="checkbox" id="select-all-timesheets" onchange="selectAllTimesheets(this.checked)"> Select all</label>
    <button id="approve-selected-timesheets" onclick="approveSelectedTimesheets()" disabled>Approve selected</button>
  </div>`+pending.map(r=>officeRecord(r,true)).join('');
}

function selectAllTimesheets(checked){
  document.querySelectorAll('.timesheet-selection').forEach(box=>{box.checked=checked});
  updateTimesheetSelection();
}

function updateTimesheetSelection(){
  const boxes=[...document.querySelectorAll('.timesheet-selection')];
  const count=boxes.filter(box=>box.checked).length;
  const selectAll=$('#select-all-timesheets');
  selectAll.checked=count===boxes.length;
  selectAll.indeterminate=count>0&&count<boxes.length;
  const button=$('#approve-selected-timesheets');
  button.disabled=count===0;
  button.textContent=count?'Approve selected ('+count+')':'Approve selected';
}

function approveSelectedTimesheets(){
  const ids=[...document.querySelectorAll('.timesheet-selection:checked')].map(box=>Number(box.value));
  if(ids.length) return reviewQueuedTimesheets(ids,'approved');
}

async function reviewQueuedTimesheets(ids,status){
  const actions=$('#approval-actions');
  if(me.role!=='manager'||!actions||actions.disabled)return;
  actions.disabled=true;
  let completed=0;
  const errors=[];
  for(const id of ids){
    try{
      await post('/records/'+id+'/review',{status});
      const record=records.find(r=>r.id===id);
      if(record)record.status=status;
      completed++;
    }catch(e){errors.push(e.message)}
  }
  if(actions.isConnected)await pendingTimesheets(errors.length>0);
  const result=completed+' '+(completed===1?'timesheet':'timesheets')+' '+status;
  notify(errors.length?result+'. '+errors.length+' could not be updated. '+errors[0]:result,errors.length>0);
}


function folderMatch(r,type){return type==='archive'?r.type==='timesheet'&&!!r.data.archivedAt:type===r.type&&!r.data.archivedAt}
async function archiveTimesheet(id,restore=false){if(!confirm(restore?'Restore this timesheet to active records?':'Confirm payroll has been actioned and archive this timesheet?'))return;try{await post('/records/'+id+'/archive',{restore});await refresh();office();notify(restore?'Timesheet restored':'Timesheet actioned and archived')}catch(e){notify(e.message,true)}}

function officeRecord(r,selectable=false){return '<div class="line"><div class="row">'+(selectable===true?'<label class="approval-checkbox"><input type="checkbox" class="timesheet-selection" value="'+r.id+'" onchange="updateTimesheetSelection()" aria-label="Select timesheet '+r.id+' for '+esc(r.employee)+'"></label>':'')+'<b>'+esc(r.employee)+' · '+esc(r.type==='timesheet'?'Timesheet':r.data.job)+' #'+r.id+'</b><span class="pill">'+esc(r.data.archivedAt?'archived':r.status)+'</span></div><p>'+esc(r.date)+'</p><div class="actions"><button class="alt" onclick="viewRecord('+r.id+')">View</button>'+(r.type==='docket'&&['submitted','approved'].includes(r.status)?'<button class="alt" onclick="openDocket('+r.id+')">Edit docket</button>':'')+(r.type==='timesheet'&&!r.data.archivedAt&&['submitted','approved','returned'].includes(r.status)?'<button class="alt" onclick="adminTimesheet('+r.id+')">Edit timesheet</button>':'')+(r.type==='timesheet'&&r.status==='approved'?(r.data.archivedAt?'<button class="alt" onclick="archiveTimesheet('+r.id+',true)">Restore</button>':'<button onclick="archiveTimesheet('+r.id+')">Actioned &amp; archive</button>'):'')+(r.status==='submitted'?'<button onclick="review('+r.id+',\'approved\')">Approve</button><button class="danger" onclick="review('+r.id+',\'returned\')">Return</button>':'')+'</div></div>'}
function payroll(){let w=prompt('Week commencing Monday (YYYY-MM-DD)',officeWeek||weekOf(today()));if(!w||weekOf(w)!==w)return;let q=x=>'"'+String(x??'').replace(/^[=+@-]/,"'(async()=>{try{me=await api('/me');").replaceAll('"','""')+'"';let rows=[['Employee','Week','Record','Hours'],...records.filter(r=>r.type==='timesheet'&&r.status==='approved'&&!r.data.archivedAt&&recWeek(r)===w).map(r=>[r.employee,w,r.id,r.data.days.reduce((a,d)=>a+hours(d),0).toFixed(2)])];let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows.map(r=>r.map(q).join(',')).join('\r\n')],{type:'text/csv'}));a.download='SWE-payroll-'+w+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}


/* Native phone Back uses real browser entries, not cached document HTML. */
const navOriginals={};let navDepth=0,navBusy=0,navReplay=false,navCurrent=null,navDirty=false,navSession=0;
const navNames=['go','home','office','officeReset','pickEmployee','pickFolder','pickWeek','pickJob','timesheet','docket','openDocket','submissionsHistory','viewRecord','plantPage','openPlant','prestartForm','serviceTracker','servicePlant','addPlant','editTargets','qualificationPage','qualificationForm','viewLicence','formsPage','assignForm','completeForm','formEvidence','toolboxPage','newTalk','openTalk','projectCompliance','complianceProject','manageSafety','manageEmployees','editEmployee','accountPage','managementPayroll','managementArchives','pendingTimesheets','adminTimesheet'];
function navOfficeState(){return {mode:officeMode,user:officeUser,folder:officeFolder,week:officeWeek,job:officeJob}}
function navRestoreOffice(o){if(!o)return;officeMode=o.mode;officeUser=o.user;officeFolder=o.folder;officeWeek=o.week;officeJob=o.job}
function navRoot(n,a){return n==='home'||(n==='go'&&a[0]==='home')}
function navRecord(n,a){let root=navRoot(n,a);let route={n,a,office:navOfficeState(),session:navSession,depth:root?0:navDepth+1};if(!navCurrent){route.depth=0;window.history.replaceState({sweNav:route},'')}else if(root){route.depth=navDepth+1;window.history.pushState({sweNav:route},'')}else if(n===navCurrent.n&&JSON.stringify(a)===JSON.stringify(navCurrent.a)&&JSON.stringify(route.office)===JSON.stringify(navCurrent.office)){route.depth=navDepth;window.history.replaceState({sweNav:route},'')}else window.history.pushState({sweNav:route},'');navCurrent=route;navDepth=route.depth;navDirty=false}
for(const n of navNames){if(typeof window[n]!=='function')continue;const fn=window[n];navOriginals[n]=fn;window[n]=function(...a){let outer=!navBusy&&!navReplay&&!!me;if(outer)navRecord(n,a);navBusy++;try{return fn.apply(this,a)}finally{navBusy--}}}
document.addEventListener('input',e=>{if(e.target.closest?.('#screen form'))navDirty=true});document.addEventListener('pointermove',e=>{if(e.buttons&&e.target.matches?.('#screen canvas'))navDirty=true});
window.addEventListener('popstate',async e=>{if(!me)return;let route=e.state?.sweNav;if(!route||route.session!==navSession||!navOriginals[route.n]){navReplay=true;try{await navOriginals.go('home')}finally{navReplay=false}navCurrent=null;navRecord('go',['home']);return}if(navDirty&&navCurrent&&route.depth<navDepth&&!confirm('Go back? Any changes not saved may be lost.')){window.history.go(navDepth-route.depth);return}navDirty=false;navReplay=true;try{navRestoreOffice(route.office);await navOriginals[route.n](...route.a);navCurrent=route;navDepth=route.depth;window.scrollTo(0,0)}catch(err){notify(err.message,true);await navOriginals.go('home');navCurrent=null;navRecord('go',['home'])}finally{navReplay=false}});
const navStart=start;start=async function(){navSession++;navCurrent=null;navDepth=0;navDirty=false;return navStart()};
const navLogout=logout;logout=async function(){await navLogout();navSession++;navCurrent=null;navDepth=0;navDirty=false;window.history.replaceState(null,'')};

(async()=>{try{me=await api('/me');await start()}catch{login()}})();if('serviceWorker'in navigator)navigator.serviceWorker.register('/service-worker.js').catch(()=>{});
const xeroReturn=new URLSearchParams(location.search).get('xero');
if(xeroReturn){
  history.replaceState(null,'',location.pathname+location.hash);
  notify(xeroReturn==='connected'
    ?'Xero authorised. Reopen your project and select your Xero organisation.'
    :'Xero connection failed. Reopen your project and try again.',xeroReturn!=='connected');
}
